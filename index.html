  /* ============== report validation (identical rules) ============== */
  const isReportValid = (text, customerFeedback = '') => {
    if (!text || text.trim().length === 0) return { valid: false, msg: 'Vui lòng nhập nội dung báo cáo giao dịch.' };
    const lowerText = text.toLowerCase();
    const feedbackText = String(customerFeedback || '').toLowerCase();
    const combinedFeedbackText = `${lowerText} ${feedbackText}`;
    const wordCount = text.trim().split(/\s+/).length;

    if (wordCount < 25) {
      return { valid: false, msg: `Bạn ơi, báo cáo giao dịch quá ngắn (dưới 25 từ). Làm sao bàn bạc giải pháp để phát triển tiếp theo?\n\nBạn nên viết rất cụ thể tên sản phẩm/thuốc và phản hồi của khách.\n\nBạn nên hiểu việc báo cáo tốt giúp bạn quản lý tốt hơn, hiểu tình huống hơn và cấp trên của bạn và đặc biệt BGĐ hiểu rõ bạn đang giao dịch vì để hỗ trợ xử lý khi cần cho bạn. Bạn phải cập nhật tình huống khi giao dịch xong nhé. Nếu BGĐ đọc mà nội dung cũ thì không tốt. Tôi là trợ lý IDECO của BGĐ giúp bạn tốt hơn.\n\n(Lưu ý: Hệ thống sẽ KHÔNG CHO LƯU hồ sơ nếu nội dung báo cáo không rõ ràng!)` };
    }

    const hasFeedback = /(phản hồi|ý kiến|nói|bảo|chê|khen|đắt|rẻ|giá|cần|muốn|hỏi|quan tâm|ok|chốt|không nhu cầu|chưa có nhu cầu|để xem lại|gởi báo giá|gửi báo giá|hẹn lần sau|loại thuốc nào|từ chối|đồng ý|mua|lấy|xem xét|tham khảo)/i.test(combinedFeedbackText);
    if (!hasFeedback) {
      return { valid: false, msg: `Bạn ơi, báo cáo giao dịch mà không có nội dung phản hồi của khách hàng (ví dụ: chê giá cao, không nhu cầu, để xem lại, hãy gởi báo giá, hẹn lần sau, loại thuốc nào...)? Dù là lần đầu tiếp xúc cũng cần ghi rõ phản hồi của khách.\n\nBạn nên hiểu việc báo cáo tốt giúp bạn quản lý tốt hơn, hiểu tình huống hơn và cấp trên của bạn và đặc biệt BGĐ hiểu rõ bạn đang giao dịch vì để hỗ trợ xử lý khi cần cho bạn. Bạn phải cập nhật tình huống khi giao dịch xong nhé. Nếu BGĐ đọc mà nội dung cũ thì không tốt. Tôi là trợ lý IDECO của BGĐ giúp bạn tốt hơn.\n\n(Lưu ý: Hệ thống sẽ KHÔNG CHO LƯU hồ sơ nếu nội dung báo cáo không rõ ràng!)` };
    }

    const stopWords = 'cho|đến|tới|về|ở|tại|của|và|các|những|với';
    let hasSpecificProduct = false;
    try {
      hasSpecificProduct =
        lowerText.includes('tất cả') ||
        new RegExp(`uvs\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`danh mục( thuốc)?\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`nhóm thuốc\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`loại thuốc\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText) ||
        new RegExp(`thuốc\\s+(?!(${stopWords})\\b)\\p{L}+`, 'ui').test(lowerText);
    } catch (e) {
      hasSpecificProduct = lowerText.includes('tất cả');
    }

    const genericMatch = lowerText.match(/\b(dmp|nhóm thuốc|tên thuốc|danh mục|gam thuốc|loại thuốc|nhóm sp|nhóm sản phẩm)\b/i);
    const hasProductKeyword = /(sản phẩm|sp|máy|thiết bị|bơm|van|model|hàng|catalogue|website|web|báo giá|chào|uvs|thuốc)/i.test(lowerText);

    if (genericMatch && !hasSpecificProduct) {
      return { valid: false, msg: `Bạn ơi, bạn đang viết chung chung là "${genericMatch[0].toUpperCase()}" mà không rõ ${genericMatch[0].toUpperCase()} là gì, tên thuốc cụ thể là gì? Báo cáo giao dịch mà không cụ thể sản phẩm nào, không có ý kiến khách hàng ra sao? Làm sao bàn bạc giải pháp để phát triển tiếp theo? Bạn nên viết rất cụ thể, trình bày những gì bạn đã trao đổi, đặc biệt đã chào sản phẩm, có gởi website báo giá không? Có nội dung gì cần bàn bạc lại vế Sếp, BGĐ không? Bạn đã tính trước các tình huống phản đổi để xoay sở thuyết phục không? Nên nhớ chúng ta bán cảm xúc, bán giải pháp giúp họ kinh doanh nên nói rỏ giải pháp hơn là cứ báo cáo chung chung.` };
    } else if (!hasProductKeyword && !hasSpecificProduct) {
      return { valid: false, msg: `Bạn ơi, báo cáo giao dịch mà không cụ thể sản phẩm nào, không có ý kiến khách hàng ra sao? Làm sao bàn bạc giải pháp để phát triển tiếp theo? Bạn nên viết rất cụ thể, trình bày những gì bạn đã trao đổi, đặc biệt đã chào sản phẩm, có gởi website báo giá không? Có nội dung gì cần bàn bạc lại vế Sếp, BGĐ không? Bạn đã tính trước các tình huống phản đổi để xoay sở thuyết phục không? Nên nhớ chúng ta bán cảm xúc, bán giải pháp giúp họ kinh doanh nên nói rỏ giải pháp hơn là cứ báo cáo chung chung.` };
    }
    return { valid: true };
  };

  /* delayed report warning while typing */
  useEffect(() => {

  useEffect(() => { setHasWarnedReport(false); setReportWarningMsg(null); }, [formData.id, view]);

  /* ============== Hall of fame ============== */
  useEffect(() => {
    if (!isUnlocked || customers.length === 0) return;
    const THREE_DAYS = 72 * 60 * 60 * 1000, now = Date.now();
    const wins = customers.filter(c => {
      const ok = c.status === TransactionStatus.THANH_CONG || c.status === TransactionStatus.THANH_CONG_SP_MOI;
      return ok && (now - (c.updatedAt || 0)) < THREE_DAYS;
    });
    if (!wins.length) return;
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('seenCelebrationIds') || '[]'); } catch (e) {}
    const unseen = wins.filter(c => !seen.includes(c.id));
    if (!unseen.length) return;
    unseen.sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
    setCelebrationQueue(prev => {
      const fresh = unseen.filter(c => !prev.some(q => q.id === c.id));
      if (!fresh.length) return prev;
      return [...prev, ...fresh.map(c => ({ id: c.id, staffName: c.salesRep, customerName: c.name }))];
    });
  }, [isUnlocked, customers]);

  /* ============== performance + overdue popups (once per login) ============== */
  useEffect(() => {
    if (!isUnlocked || customers.length === 0 || hasCheckedInitialPopups.current) return;
    const y = new Date(); y.setDate(y.getDate() - 1);
    const yStr = getLocalDateString(y);
    const under = [];
    staffList.forEach(s => {
      const count = customers.filter(c => c.salesRep === s.name && c.transactionDate === yStr).length;
      const isNewbie = (Date.now() - (s.joinedAt || 0)) < 86400000;
      if (count < 3 && !isNewbie) under.push(s.name);
    });
    if (under.length) setPerformanceAlert(under);
    const overdue = customers.filter(isCustomerOverdue);
    if (overdue.length) setOverdueFollowingAlert(overdue);
    hasCheckedInitialPopups.current = true;
  }, [isUnlocked, customers, staffList]);

  /* ============== auto lock staff with >2 overdue ============== */
  useEffect(() => {
    if (!isUnlocked || !customers.length || !staffList.length) return;
    const overdue = customers.filter(isCustomerOverdue);
    const byStaff = overdue.reduce((acc, c) => { acc[c.salesRep] = (acc[c.salesRep] || 0) + 1; return acc; }, {});
    Object.entries(byStaff).forEach(([name, count]) => {
      const s = staffList.find(x => x.name === name);
      if (!s) return;
      if (count > 2 && !s.isLocked) {
        const recentlyUnlocked = s.unlockedAt && (Date.now() - s.unlockedAt < 86400000);
        if (!recentlyUnlocked) dbUpdate(`staff/${s.id}`, { isLocked: true });
      } else if (count <= 2 && s.unlockedAt) {
        dbUpdate(`staff/${s.id}`, { unlockedAt: null });
      }
    });
    staffList.forEach(s => { if (!byStaff[s.name] && s.unlockedAt) dbUpdate(`staff/${s.id}`, { unlockedAt: null }); });
  }, [customers, staffList, isUnlocked]);

  /* ============== appointment monitor ============== */
  useEffect(() => {
    if (!isUnlocked || !currentStaff) return;
    const iv = setInterval(() => {
      if (activeAlert || confirmModal || overdueReminder || adviceModal || quickReportCustomer || advisorCustomer) return;
      const now = new Date();
      let found = false;
      for (const c of customers) {
        if (c.salesRep !== currentStaff.name) continue;
        for (const apt of (c.appointments || [])) {
          if (apt.isCompleted) continue;
          const at = new Date(`${apt.date}T${apt.time}`);
          const diff = (at.getTime() - now.getTime()) / 60000;
          if (diff > 0 && diff <= 1440) {
            if (!dismissedOverdueRef.current.has(apt.id + '_upcoming')) {
              setActiveAlert({ id: apt.id, customerId: c.id, staffName: c.salesRep, customerName: c.name, type: c.type, alertType: 'upcoming',
                msg: `Bạn có cuộc hẹn với khách hàng ${c.name} vào lúc ${apt.time} ngày ${viDate(apt.date)}.` });
              found = true; break;
            }
          } else if (diff < 0) {
            if (!dismissedOverdueRef.current.has(apt.id + '_late')) {
              setActiveAlert({ id: apt.id, customerId: c.id, staffName: c.salesRep, customerName: c.name, type: c.type, alertType: 'late',
                msg: `Bạn đã bị trễ hẹn với khách hàng ${c.name} lúc ${apt.time} ngày ${viDate(apt.date)}. Vui lòng xác nhận đã hẹn hoặc thiết lập lịch hẹn mới!` });
              found = true; break;
            }
          }
        }
        if (found) break;
      }
      if (!found) setActiveAlert(null);
    }, 20000);
    return () => clearInterval(iv);
  }, [customers, isUnlocked, currentStaff, activeAlert, confirmModal, overdueReminder, adviceModal, quickReportCustomer, advisorCustomer]);

  /* ============== overdue-with-no-future-appointment monitor ============== */
  useEffect(() => {
    if (!isUnlocked || !currentStaff) return;
    const iv = setInterval(() => {
      if (activeAlert || confirmModal || overdueReminder || adviceModal || quickReportCustomer || advisorCustomer) return;
      for (const c of customers) {
        if (c.salesRep !== currentStaff.name) continue;
        if (!isCustomerOverdue(c)) continue;
        const today = getLocalDateString(new Date());
        const items = (c.appointments || []).filter(a => !a.isCompleted && a.date < today);
        items.sort((a, b) => b.date.localeCompare(a.date));
        const target = items[0];
        if (target && !dismissedOverdueRef.current.has(target.id)) {
          setOverdueReminder({ customerName: c.name, content: target.content, date: target.date, id: target.id });
          break;
        }
      }
    }, 5000);
    return () => clearInterval(iv);
  }, [isUnlocked, currentStaff, customers, activeAlert, confirmModal, overdueReminder, adviceModal, quickReportCustomer, advisorCustomer]);

  /* ============== target goal ============== */
  useEffect(() => {
    if (!isUnlocked || !currentStaff) return;
    const check = () => {
      const raw = localStorage.getItem(`targetGoal_${currentStaff.name}`);
      if (!raw) return;
      try {
        const saved = JSON.parse(raw);
        if (Date.now() - saved.timestamp < 12 * 3600 * 1000) return;
        const made = customers.filter(c => c.salesRep === currentStaff.name && c.transactionDate === saved.date).length;
        if (made < saved.goal) {
          const k = `targetWarningShown_${currentStaff.name}_${saved.date}`;
          if (!localStorage.getItem(k)) { setTargetWarning(true); localStorage.setItem(k, 'true'); }
        }
      } catch (e) {}
    };
    check();
    const iv = setInterval(check, 60000);
    return () => clearInterval(iv);
  }, [isUnlocked, currentStaff, customers]);

  /* ============================= ACTIONS ============================= */
  /* Xac nhan chung — ho tro yeu cau mat khau truoc khi thuc thi */
  const runConfirm = () => {
    if (!confirmModal) return;
    if (confirmModal.requirePassword) {
      if (confirmPassInput !== DELETE_PASSWORD) {
        setConfirmShake(true);

        setConfirmPassInput('');

      }

    const fn = confirmModal.onConfirm;
    setConfirmModal(null);
    setConfirmPassInput('');

  const handleLogin = () => {
    if (loginInput === MASTER_KEY) {
      setIsUnlocked(true);

    setUploadBusy(true); setUploadMsg('Đang đọc file...');
    const reader = new FileReader();
    reader.onerror = () => {
      setUploadBusy(false); setUploadMsg('');
      notify('Không đọc được file (lỗi trình duyệt)', 'error'); setPendingFileName('');
    };
    reader.onload = (ev) => {
      try {
        /* ArrayBuffer thay cho readAsBinaryString: doc dung file .xlsx lon, khong loi ky tu */
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
        if (!wb.SheetNames.length) throw new Error('no sheet');
        const ws = wb.Sheets[wb.SheetNames[0]];

        /* Doc dang mang 2 chieu de KHONG bo sot cot khi o dau tien trong */
        const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false, raw: false });
        if (matrix.length < 2) {
          setUploadBusy(false); setUploadMsg('');
          notify('File Excel không có dữ liệu (cần ít nhất 1 dòng tiêu đề + 1 dòng dữ liệu)', 'error');
          setPendingFileName(''); return;
        }

        /* Tim dong tieu de that su: dong dau tien co >=2 o co chu */
        let hIdx = 0;
        for (let i = 0; i < Math.min(matrix.length, 12); i++) {
          const filled = matrix[i].filter(v => String(v ?? '').trim() !== '').length;
          if (filled >= 2) { hIdx = i; break; }
        }

        const rawHeaders = matrix[hIdx].map((h, i) => {
          const t = String(h ?? '').trim();
          return t || `Cột ${i + 1}`;
        });
        /* Chong trung ten cot -> tranh mat cot khi Excel co 2 cot cung ten */
        const seen = {};
        const headers = rawHeaders.map(h => {
          if (seen[h] === undefined) { seen[h] = 0; return h; }
          seen[h] += 1; return `${h} (${seen[h] + 1})`;
        });

        const data = [];
        for (let i = hIdx + 1; i < matrix.length; i++) {
          const row = matrix[i];
          if (!row || row.every(v => String(v ?? '').trim() === '')) continue;
          const obj = {};
          headers.forEach((h, c) => { obj[h] = row[c] ?? ''; });
          data.push(obj);
        }

        if (!data.length) {
          setUploadBusy(false); setUploadMsg('');
          notify('File Excel không có dòng dữ liệu nào', 'error'); setPendingFileName(''); return;
        }

        setExcelHeaders(headers);
        setExcelRawData(data);

        /* Tu doan cot theo dung khung: Ten KH - Nguoi lien he - Dien thoai - Dia chi.
           Moi cot chi duoc nhan 1 lan (taken) de "Người liên hệ" khong bi cot SDT cuop mat. */
        const low = headers.map(h => h.toLowerCase().trim().replace(/\s+/g, ' '));
        const taken = new Set();
        const pick = (exact, partial) => {
          for (const k of exact) {
            const i = low.findIndex((h, idx) => !taken.has(idx) && h === k);
            if (i > -1) { taken.add(i); return headers[i]; }
          }
          for (const k of partial) {
            const i = low.findIndex((h, idx) => !taken.has(idx) && h.includes(k));
            if (i > -1) { taken.add(i); return headers[i]; }
          }
          return '';
        };

        /* Thu tu doan quan trong: doan cai co tu khoa dac trung nhat truoc */
        const mPhone = pick(
          ['số điện thoại', 'điện thoại', 'sđt', 'sdt', 'phone', 'mobile', 'số đt', 'đt'],
          ['điện thoại', 'sđt', 'sdt', 'phone', 'mobile']);
        const mContact = pick(
          ['người liên hệ', 'nguoi lien he', 'người đại diện', 'đại diện', 'liên hệ',
           'contact', 'người phụ trách', 'chủ nhà thuốc', 'dược sĩ'],
          ['người liên hệ', 'đại diện', 'liên hệ', 'contact', 'phụ trách', 'dược sĩ']);
        const mAddress = pick(
          ['địa chỉ', 'dia chi', 'address'],
          ['địa chỉ', 'dia chi', 'address']);
        const mName = pick(
          ['tên khách hàng', 'tên kh', 'khách hàng', 'tên nhà thuốc', 'nhà thuốc', 'tên', 'name'],
          ['tên', 'name', 'khách hàng', 'nhà thuốc', 'công ty', 'cơ sở']);

        setExcelMapping({ name: mName, contactPerson: mContact, phone: mPhone, address: mAddress });
        setUploadBusy(false);
        setUploadMsg(`Đã đọc ${data.length} dòng · ${headers.length} cột`);
        notify(`Đã đọc file: ${data.length} dòng, ${headers.length} cột`, 'success');
      } catch (err) {
        console.error('Excel read error:', err);
        setUploadBusy(false); setUploadMsg('');
        notify('Không đọc được file Excel. Hãy lưu lại dạng .xlsx rồi thử lại.', 'error');
        setPendingFileName('');
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  /* Bo ve an toan: du loi gi xay ra, giao dien khong bao gio ket o trang thai "Dang luu" */
  const safeFinish = () => { try { rtResume(); } catch (e) {} setUploadBusy(false); setUploadMsg(''); };

  /* Them file moi vao Firebase (KHONG xoa cac file da co) — chia lo de khong vo gioi han REST */
  const handleConfirmMapping = async () => {
    if (!excelRawData) return;
    if (!excelMapping.name) { notify('Vui lòng chọn cột Tên khách hàng', 'error'); return; }
    if (uploadBusy) return;

    const fileId = uuid();
    const norm = (v) => {
      if (v === null || v === undefined) return '';
      if (v instanceof Date) return v.toLocaleDateString('vi-VN');
      return String(v).trim();
    };

    const rows = excelRawData.map(r => ({
      id: uuid(),
      fileId,
      name: norm(r[excelMapping.name]),
      /* Nguoi lien he: khong bat buoc -> de trong neu file khong co */
      contactPerson: excelMapping.contactPerson ? norm(r[excelMapping.contactPerson]) : '',
      /* SDT: bo dau cach/cham/gach, giu lai so 0 dau neu Excel da cat mat */
      phone: excelMapping.phone ? norm(r[excelMapping.phone]).replace(/[\s.\-()]/g, '') : '',
      address: excelMapping.address ? norm(r[excelMapping.address]) : '',
      isCalled: false,
      claimedBy: ''
    })).filter(c => c.name);

    if (!rows.length) {
      notify(`Không có dòng nào hợp lệ — cột "${excelMapping.name}" đang trống. Hãy chọn lại cột tên khách hàng.`, 'error', 5200);
      return;
    }

    /* AN TOAN: hien danh sach + luu localStorage NGAY, truoc khi dung toi Firebase.
       Du Firebase co hong hoan toan, nhan vien van co danh sach de goi. */
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      const merged = [...prev, ...rows.filter(r => !ids.has(r.id))];
      try { localStorage.setItem('ideco_excelBackup', JSON.stringify(merged.slice(0, 8000))); } catch (e) {}
      return merged;
    });

    setUploadBusy(true);
    uploadCancelRef.current = false;
    setUploadMsg(`Kiểm tra kết nối Firebase...`);
    try {

    /* Thu ghi 1 ban ghi nho truoc -> phat hien ngay loi quyen/mang,
       thay vi treo giua chung khi da lưu do dang */
    const probeId = '__probe__';
    const probe = await dbUpdateDetailed('excelCustomers', { [probeId]: { t: Date.now() } }, 2, 12000);
    if (!probe.ok) {
      setUploadBusy(false); setUploadMsg('');
      setDbError({
        stage: 'Kiểm tra ghi thử',
        err: probe.err,
        hint: probe.hint,
        url: `${DB}/excelCustomers.json`
      });
      notify('Không ghi được vào Firebase — xem khung đỏ để biết nguyên nhân', 'error', 6000);
      return;
    }
    setDbError(null);
    await dbRemove(`excelCustomers/${probeId}`);

    setUploadMsg(`Chuẩn bị lưu ${rows.length} dòng...`);
    rtPause();   /* tam dung realtime -> khong tai lai ca danh sach giua chung */

    /* Chia lo theo DUNG LUONG (khong theo so dong): tieng Viet co dau 3 byte/ky tu,
       nen 400 dong co the vuot 1MB va Firebase se im lang tu choi -> treo. */
    const MAX_BYTES = 256 * 1024;   /* 256KB / lo — an toan tuyet doi */
    const MAX_ROWS  = 150;
    const batches = [];
    let cur = {}, curBytes = 0, curCount = 0;
    for (const r of rows) {
      const sz = JSON.stringify(r).length + r.id.length + 4;
      if (curCount > 0 && (curBytes + sz > MAX_BYTES || curCount >= MAX_ROWS)) {
        batches.push(cur); cur = {}; curBytes = 0; curCount = 0;
      }
      cur[r.id] = r; curBytes += sz; curCount++;
    }
    if (curCount > 0) batches.push(cur);

    let saved = 0;
    const failedBatches = [];
    let lastErr = null;
    for (let b = 0; b < batches.length; b++) {
      if (uploadCancelRef.current) break;
      const n = Object.keys(batches[b]).length;
      setUploadMsg(`Đang lưu ${saved}/${rows.length} dòng  ·  lô ${b + 1}/${batches.length}`);
      const res = await dbUpdateDetailed('excelCustomers', batches[b], 3, 25000);
      if (res.ok) saved += n;
      else {
        failedBatches.push(batches[b]);
        lastErr = res;
        /* Loi khong the khac phuc (rules/URL) -> dung ngay, khong nem tiep 30 lo vo ich */
        if (res.fatal) {
          setDbError({ stage: `Lưu lô ${b + 1}/${batches.length}`, err: res.err, hint: res.hint, url: `${DB}/excelCustomers.json` });
          break;
        }
      }
      /* nhuong CPU cho giao dien ve lai -> khong bi "dung hinh" */
      await new Promise(res2 => setTimeout(res2, 60));
    }
    if (lastErr && !lastErr.fatal) {
      setDbError({ stage: 'Lưu dữ liệu', err: lastErr.err, hint: lastErr.hint, url: `${DB}/excelCustomers.json` });
    }

    const cancelled = uploadCancelRef.current;

    if (saved === 0) {
      rtResume();
      setUploadBusy(false); setUploadMsg('');
      notify(cancelled
        ? 'Đã hủy — chưa lưu dòng nào.'
        : 'Không lưu được lên Firebase. Kiểm tra mạng / quyền ghi Database rồi thử lại.', 'error', 5500);
      return;
    }

    const okFile = await dbSet(`excelFiles/${fileId}`, {
      id: fileId,
      name: pendingFileName || ('File ' + new Date().toLocaleDateString('vi-VN')),
      uploadedAt: Date.now(),
      uploadedBy: currentStaff?.name || '',
      count: saved
    });

    /* Hien ngay tren man hinh, khong doi realtime day ve */
    const savedIds = new Set();
    batches.forEach((bt, i) => { if (!failedBatches.includes(bt)) Object.keys(bt).forEach(k => savedIds.add(k)); });
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      return [...prev, ...rows.filter(r => savedIds.has(r.id) && !ids.has(r.id))];
    });
    if (okFile) {
      setExcelFiles(prev => ({
        ...prev,
        [fileId]: { id: fileId, name: pendingFileName || ('File ' + new Date().toLocaleDateString('vi-VN')),
                    uploadedAt: Date.now(), uploadedBy: currentStaff?.name || '', count: saved }
      }));
    }

    rtResume();
    setUploadBusy(false); setUploadMsg('');
    const missing = rows.length - saved;

    if (missing > 0) {
      /* Giu lai phan chua luu de bam "Lưu tiếp phần còn thiếu", khong phai lam lai tu dau */
      const savedNameSet = new Set(rows.filter(r => savedIds.has(r.id)).map(r => r.name));
      setResumeState({
        fileId,
        fileName: pendingFileName || 'File',
        rows: rows.filter(r => !savedIds.has(r.id)),
        total: rows.length,
        saved
      });
      notify(cancelled
        ? `Đã dừng — lưu được ${saved}/${rows.length} dòng. Bấm "Lưu tiếp" để hoàn tất.`
        : `Lưu được ${saved}/${rows.length} dòng — còn ${missing} dòng lỗi mạng. Bấm "Lưu tiếp" để hoàn tất.`, 'warning', 6000);
    } else {
      setResumeState(null);
      notify(`Đã thêm ${saved} khách hàng từ file "${pendingFileName}"`, 'success');
    }
    setExcelRawData(null); setExcelHeaders([]); setPendingFileName('');
    } catch (err) {
      console.error('upload error:', err);
      safeFinish();
      notify('Có lỗi bất ngờ khi lưu. Phần đã lưu vẫn giữ nguyên — hãy thử lại.', 'error', 5500);
    }
  };

  /* Luu tiep phan con thieu — dung lai dung fileId cu */
  const handleResumeUpload = async () => {
    if (!resumeState || uploadBusy) return;
    const { fileId, rows, total, saved: already } = resumeState;
    setUploadBusy(true);
    uploadCancelRef.current = false;
    rtPause();
    try {
    const MAX_BYTES = 256 * 1024, MAX_ROWS = 150;
    const batches = [];
    let cur = {}, curBytes = 0, curCount = 0;
    for (const r of rows) {
      const sz = JSON.stringify(r).length + r.id.length + 4;
      if (curCount > 0 && (curBytes + sz > MAX_BYTES || curCount >= MAX_ROWS)) {
        batches.push(cur); cur = {}; curBytes = 0; curCount = 0;
      }
      cur[r.id] = r; curBytes += sz; curCount++;
    }
    if (curCount > 0) batches.push(cur);

    let saved = 0;
    const stillFailed = [];
    for (let b = 0; b < batches.length; b++) {
      if (uploadCancelRef.current) break;
      const n = Object.keys(batches[b]).length;
      setUploadMsg(`Đang lưu tiếp ${already + saved}/${total} dòng  ·  lô ${b + 1}/${batches.length}`);
      const ok = await dbUpdateRetry('excelCustomers', batches[b], 4, 25000);
      if (ok) saved += n; else stillFailed.push(batches[b]);
      await new Promise(res => setTimeout(res, 60));
    }

    const okIds = new Set();
    batches.forEach(bt => { if (!stillFailed.includes(bt)) Object.keys(bt).forEach(k => okIds.add(k)); });
    setExcelCustomers(prev => {
      const ids = new Set(prev.map(p => p.id));
      return [...prev, ...rows.filter(r => okIds.has(r.id) && !ids.has(r.id))];
    });
    const totalSaved = already + saved;
    await dbUpdate(`excelFiles/${fileId}`, { count: totalSaved });
    setExcelFiles(prev => prev[fileId] ? { ...prev, [fileId]: { ...prev[fileId], count: totalSaved } } : prev);

    rtResume();
    setUploadBusy(false); setUploadMsg('');
    const left = rows.filter(r => !okIds.has(r.id));
    if (left.length) {
      setResumeState({ ...resumeState, rows: left, saved: totalSaved });
      notify(`Còn ${left.length} dòng chưa lưu được. Thử lại khi mạng ổn định hơn.`, 'warning', 5500);
    } else {
      setResumeState(null);
      notify(`Hoàn tất — đã lưu đủ ${totalSaved}/${total} khách hàng`, 'success');
    }
    } catch (err) {
      console.error('resume error:', err);
      safeFinish();
      notify('Có lỗi bất ngờ khi lưu tiếp. Hãy thử lại.', 'error', 5000);
    }
  };

  /* Xoa 1 file va toan bo dong thuoc file do */
  const handleDeleteExcelFile = (fileId, fileName) => {
    setConfirmModal({
      title: 'Xóa file danh sách',
      requirePassword: true,
      message: `Xóa file "${fileName}" và toàn bộ khách hàng thuộc file này khỏi hệ thống? Thao tác này cần mật khẩu quản trị.`,
      onConfirm: async () => {
        const victims = excelCustomers.filter(c => c.fileId === fileId);
        setUploadBusy(true); setUploadMsg(`Đang xóa ${victims.length} dòng...`);
        rtPause();
        let done = 0, fail = 0;
        /* Xoa theo lo 300 -> khong treo khi file lon */
        for (let i = 0; i < victims.length; i += 300) {
          const upd = {};
          victims.slice(i, i + 300).forEach(c => { upd[c.id] = null; });
          const ok = await dbUpdateRetry('excelCustomers', upd, 3, 25000);
          if (ok) done += Object.keys(upd).length; else fail += Object.keys(upd).length;
          setUploadMsg(`Đang xóa ${done}/${victims.length} dòng...`);
        }
        await dbRemove(`excelFiles/${fileId}`);
        /* Cap nhat giao dien ngay */
        setExcelCustomers(prev => {
          const left = prev.filter(c => c.fileId !== fileId);
          try { localStorage.setItem('ideco_excelBackup', JSON.stringify(left.slice(0, 8000))); } catch (e) {}
          return left;
        });
        setExcelFiles(prev => { const n = { ...prev }; delete n[fileId]; return n; });
        rtResume();
        setUploadBusy(false); setUploadMsg('');
        if (fail) notify(`Đã xóa ${done} dòng — còn ${fail} dòng lỗi mạng, thử xóa lại`, 'warning', 5200);
        else notify(`Đã xóa file và ${done} khách hàng`, 'success');
      }
    });
  };

  /* Xoa tat ca file + toan bo danh sach */
  const handleClearExcelData = () => {

        notify(ok1 && ok2 ? 'Đã xóa toàn bộ danh sách' : 'Xóa chưa hoàn tất — kiểm tra mạng và thử lại', ok1 && ok2 ? 'success' : 'warning');

  /* ===== KIEM TRA KET NOI FIREBASE — chay tung buoc de biet CHINH XAC hong o dau ===== */
  const runDiagnostic = async () => {
    if (diagRunning) return;
    setDiagRunning(true);
    setDiagResult(null);
    const steps = [];
    const add = (name, ok, detail) => steps.push({ name, ok, detail });

    /* 0. Dang dung duong truyen nao */
    add('Kết nối Firebase', FB_READY,
      FB_READY ? 'Dùng SDK WebSocket (giống bản gốc AI Studio chạy tốt)'
               : 'KHÔNG tải được Firebase SDK — đang chạy REST dự phòng. Kiểm tra mạng có chặn gstatic.com không.');

    /* 1. Giao thuc trang */
    const proto = location.protocol;
    add('Giao thức trang', proto !== 'file:', proto === 'file:'
      ? 'Đang mở bằng file:// — trình duyệt chặn gọi mạng. Hãy tải file lên hosting (Netlify/GitHub Pages) hoặc mở qua http://localhost.'
      : `${proto}// — hợp lệ`);

    /* 2. Trang co online khong */
    add('Kết nối Internet', navigator.onLine, navigator.onLine ? 'Có mạng' : 'Trình duyệt báo mất mạng');

    /* 3. Doc thu (GET) */
    let readOk = false;
    try {
      const r = await fetchTimeout(`${DB}/.json?shallow=true`, {}, 12000);
      readOk = r.ok;
      let b = ''; try { b = (await r.text()).slice(0, 200); } catch (e) {}
      add('Đọc dữ liệu (GET)', r.ok, r.ok ? 'Đọc được' : `HTTP ${r.status} — ${b}`);
    } catch (e) {
      add('Đọc dữ liệu (GET)', false, e.name === 'AbortError'
        ? 'Quá thời gian chờ — mạng chặn hoặc rất chậm'
        : `${e.name}: ${e.message} — thường do tường lửa/VPN chặn firebaseio.com`);
    }

    /* 4. Ghi thu (PATCH) — day la buoc quyet dinh */
    const tId = '__diag__' + Date.now();
    const w = await dbUpdateDetailed('__diag__', { [tId]: { t: Date.now() } }, 1, 12000);
    add('Ghi dữ liệu (thử 1 dòng)', w.ok,
      w.ok ? `Ghi được qua ${w.via} — quyền ghi OK` : `${w.err}${w.hint ? '  →  ' + w.hint : ''}`);

    /* 5. Ghi thu 1 lo lon giong that */
    let bulkOk = false;
    if (w.ok) {
      const fake = {};
      for (let i = 0; i < 150; i++) {
        fake['__diag_row_' + i] = { id: '__diag_row_' + i, fileId: tId,
          name: 'Nhà thuốc kiểm tra kết nối số ' + i, phone: '0909000' + i,
          address: 'Số ' + i + ' đường Nguyễn Văn Trỗi, Phường 12, Quận Phú Nhuận, TP Hồ Chí Minh',
          isCalled: false, claimedBy: '' };
      }
      const t0 = Date.now();
      const bw = await dbUpdateDetailed('__diag__', fake, 1, 25000);
      bulkOk = bw.ok;
      const kb = (new Blob([JSON.stringify(fake)]).size / 1024).toFixed(0);
      add('Ghi lô 150 dòng thật', bw.ok,
        bw.ok ? `Ghi ${kb}KB qua ${bw.via} trong ${((Date.now() - t0) / 1000).toFixed(1)}s — tốc độ ổn`
              : `${bw.err}${bw.hint ? '  →  ' + bw.hint : ''}`);
    } else {
      add('Ghi lô 150 dòng thật', false, 'Bỏ qua — bước ghi cơ bản đã lỗi');
    }

    /* Don dep */
    try { await dbRemove('__diag__'); } catch (e) {}

    const allOk = steps.every(s => s.ok);
    setDiagResult({ steps, allOk, when: new Date().toLocaleTimeString('vi-VN') });
    setDiagRunning(false);
  };

  /* Canh bao neu dong tab khi dang luu do len Firebase */
  useEffect(() => {
    if (!uploadBusy) return;
    const h = (e) => { e.preventDefault(); e.returnValue = ''; return ''; };
    window.addEventListener('beforeunload', h);
    return () => window.removeEventListener('beforeunload', h);
  }, [uploadBusy]);

  /* ============== micro devices ============== */
  const stopMicMonitor = useCallback(() => {
    if (micRafRef.current) { cancelAnimationFrame(micRafRef.current); micRafRef.current = null; }
    try { micStreamRef.current?.getTracks().forEach(t => t.stop()); } catch (e) {}
    micStreamRef.current = null;
    try { micAudioCtxRef.current?.close(); } catch (e) {}
    micAudioCtxRef.current = null;
    setMicLevel(0);
  }, []);

  /* Mo stream de do muc am thanh -> giup chon dung micro */
  const startMicMonitor = useCallback(async (deviceId) => {
    stopMicMonitor();
    try {
      const constraints = {
        audio: deviceId
          ? { deviceId: { exact: deviceId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          : { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      micStreamRef.current = stream;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      micAudioCtxRef.current = ctx;
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const buf = new Uint8Array(analyser.frequencyBinCount);
      const loop = () => {
        analyser.getByteTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i] - 128) / 128; if (v > peak) peak = v; }
        setMicLevel(Math.min(100, Math.round(peak * 260)));
        micRafRef.current = requestAnimationFrame(loop);
      };
      loop();
      return true;
    } catch (e) {
      return false;
    }
  }, [stopMicMonitor]);

  /* Liet ke micro: xin quyen truoc de lay duoc ten thiet bi day du */
  const refreshMicDevices = useCallback(async (askPermission = true) => {
    if (!navigator.mediaDevices?.enumerateDevices) { notify('Trình duyệt không hỗ trợ chọn micro', 'error'); return []; }
    setMicLoading(true);
    try {
      if (askPermission) {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ audio: true });
          s.getTracks().forEach(t => t.stop());
        } catch (e) {
          notify('Bạn cần cho phép quyền Micro trên trình duyệt', 'error');
        }
      }
      const list = await navigator.mediaDevices.enumerateDevices();
      const mics = list.filter(d => d.kind === 'audioinput');
      setMicDevices(mics);
      /* neu micro da chon khong con ton tai -> quay ve mac dinh */
      if (selectedMicId && !mics.some(m => m.deviceId === selectedMicId)) {
        setSelectedMicId(''); setSelectedMicLabel('');
        try { localStorage.removeItem('ideco_micId'); localStorage.removeItem('ideco_micLabel'); } catch (e) {}
      }
      return mics;
    } finally { setMicLoading(false); }
  }, [notify, selectedMicId]);

  const chooseMic = useCallback(async (d) => {
    const id = d ? d.deviceId : '';
    const label = d ? (d.label || 'Micro không tên') : '';
    setSelectedMicId(id); setSelectedMicLabel(label);
    try {
      if (id) { localStorage.setItem('ideco_micId', id); localStorage.setItem('ideco_micLabel', label); }
      else { localStorage.removeItem('ideco_micId'); localStorage.removeItem('ideco_micLabel'); }
    } catch (e) {}
    const ok = await startMicMonitor(id);
    if (!ok) notify('Không mở được micro này, thử thiết bị khác', 'error');
    else notify(`Đã chọn: ${label || 'Micro mặc định hệ thống'} — hãy nói thử để xem vạch sóng`, 'success');
  }, [startMicMonitor, notify]);

  /* Tu dong cap nhat khi cam/rut micro USB, tai nghe bluetooth... */
  useEffect(() => {
    if (!navigator.mediaDevices?.addEventListener) return;
    const h = () => { refreshMicDevices(false); };
    navigator.mediaDevices.addEventListener('devicechange', h);
    return () => navigator.mediaDevices.removeEventListener('devicechange', h);
  }, [refreshMicDevices]);

  useEffect(() => { if (showMicPicker) refreshMicDevices(true); else stopMicMonitor(); }, [showMicPicker]);
  useEffect(() => () => stopMicMonitor(), [stopMicMonitor]);

  /* Giu stream cua micro da chon mo san khi ghi am -> trinh duyet uu tien dung thiet bi nay */
  const ensureSelectedMicStream = useCallback(async () => {
    if (!selectedMicId) return;
    if (micStreamRef.current) return;
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: selectedMicId } } });
      micStreamRef.current = s;
    } catch (e) {}
  }, [selectedMicId]);

  /* ============== KHAI BAO NHANH: speech -> text -> AI fill form ============== */
  const stopVoiceDeclaration = useCallback(() => {
    voiceDeclListeningRef.current = false;
    setIsVoiceDeclListening(false);
    const r = voiceDeclRecognitionRef.current;
    voiceDeclRecognitionRef.current = null;
    if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
  }, []);

  const startVoiceDeclaration = useCallback(async () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('Trình duyệt không hỗ trợ chuyển giọng nói thành văn bản. Nên dùng Chrome/Edge mới.', 'error', 5000); return; }
    if (voiceDeclListeningRef.current) { stopVoiceDeclaration(); return; }
    /* Tranh 2 bo nhan dien chay cung luc */
    if (isGlobalListeningRef.current) {
      isGlobalListeningRef.current = false; setIsGlobalListening(false);
      const old = globalRecognitionRef.current;
      if (old) { old.onend = null; old.onresult = null; try { old.stop(); } catch (e) {} }
    }
    if (listeningFieldRef.current) { listeningFieldRef.current = null; setListeningField(null); try { recognitionRef.current?.stop(); } catch (e) {} }

    await ensureSelectedMicStream();
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true; rec.continuous = true;
    voiceDeclBaseRef.current = voiceDeclaration || '';
    let interimNow = '';
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) {
        const p = final.trim();
        if (p) voiceDeclBaseRef.current += (voiceDeclBaseRef.current.trim() ? ' ' : '') + p;
        interimNow = '';
      } else interimNow = interim;
      setVoiceDeclaration(voiceDeclBaseRef.current + (interimNow ? (voiceDeclBaseRef.current.trim() ? ' ' : '') + interimNow : ''));
    };
    rec.onerror = (e) => {
      if (e && ['not-allowed','service-not-allowed'].includes(e.error)) {
        stopVoiceDeclaration(); notify('Micro đang bị chặn. Hãy cấp quyền Micro cho trang web.', 'error', 5000);
      }
    };
    rec.onend = () => {
      if (voiceDeclListeningRef.current) setTimeout(() => {
        if (voiceDeclListeningRef.current) { try { rec.start(); } catch (e) {} }
      }, 180);
    };
    voiceDeclRecognitionRef.current = rec;
    voiceDeclListeningRef.current = true; setIsVoiceDeclListening(true);
    try { rec.start(); } catch (e) { stopVoiceDeclaration(); notify('Không khởi động được Micro.', 'error'); }
  }, [voiceDeclaration, ensureSelectedMicStream, notify, stopVoiceDeclaration]);

  const handleAnalyzeVoiceDeclaration = async () => {
    const text = (voiceDeclaration || '').trim();
    if (!text) { notify('Hãy nói hoặc nhập nội dung khai báo trước khi phân tích AI.', 'warning'); return; }
    stopVoiceDeclaration();
    setIsVoiceDeclAnalyzing(true); setVoiceDeclNotice(null);
    try {
      const r = await analyzeVoiceCustomerDeclaration(text);
      const allowedTypes = Object.values(CustomerType);
      setFormData(prev => ({
        ...prev,
        name: r.name || prev.name,
        contactPerson: r.contactPerson || prev.contactPerson,
        phone: r.phone ? normPhone(r.phone) : prev.phone,
        address: r.address || prev.address,
        province: (r.province && VIETNAM_PROVINCES.includes(r.province)) ? r.province : prev.province,
        type: (r.type && allowedTypes.includes(r.type)) ? r.type : prev.type,
        report: r.report || prev.report,
        customerFeedback: r.customerFeedback || prev.customerFeedback || ''
      }));
      const missing = r.missing || [];
      const qualityIssues = r.qualityIssues || [];
      setVoiceQualityIssues(qualityIssues);
      setVoiceQualityAdvice(r.qualityAdvice || '');
      if (missing.length) {
        setVoiceDeclNotice({ type: 'warning', text: `AI đã điền các thông tin nhận diện được. Còn thiếu thông tin khai báo: ${missing.join(', ')}.` });
        notify(`Còn thiếu: ${missing.join(', ')}`, 'warning', 6500);
      } else if (qualityIssues.length) {
        setVoiceDeclNotice({ type: 'warning', text: 'AI đã tự điền dữ liệu. Báo cáo vẫn còn vài điểm nên bổ sung để Ban Giám đốc dễ xử lý hơn.' });
        notify('AI đã điền dữ liệu và phát hiện nội dung báo cáo nên bổ sung', 'warning', 5200);
      } else {
        setVoiceDeclNotice({ type: 'success', text: 'AI đã nhận diện đủ thông tin và báo cáo có các nội dung chính cần thiết.' });
        notify('Đã phân tích và tự động điền thông tin khách hàng', 'success', 3600);
      }
    } catch (e) {
      if (e && e.message === 'NO_KEY') {
        setVoiceDeclNotice({ type: 'error', text: 'Chưa có Gemini API key. Vào Hệ thống → Cài đặt AI để nhập/lưu key.' });
        notify('Chưa có Gemini API key', 'error', 5000);
      } else {
        setVoiceDeclNotice({ type: 'error', text: 'Gemini chưa phân tích được nội dung. Kiểm tra mạng/API key rồi thử lại.' });
        notify('Lỗi kết nối Gemini khi phân tích khai báo', 'error');
      }
    } finally { setIsVoiceDeclAnalyzing(false); }
  };

  /* ============== speech to text ============== */
  const applyTranscript = (field, txt) => {
    if (field === 'appointmentContent') setNewAppointment(prev => ({ ...prev, content: txt }));
    else setFormData(prev => ({ ...prev, [field]: txt }));
  };

  const startGlobalRecognition = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('Trình duyệt không hỗ trợ nhận diện giọng nói', 'error'); return; }
    if (globalRecognitionRef.current) {
      const old = globalRecognitionRef.current;
      old.onend = null; old.onresult = null;
      try { old.stop(); } catch (e) {}
    }
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true; rec.continuous = true;
    globalRecognitionRef.current = rec;
    let interimNow = '';
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      const field = activeFieldRef.current;
      if (!field) return;
      if (final) {
        let p = final;
        if (field === 'phone') p = p.replace(/\s+/g, '');
        else if (['name', 'contactPerson', 'address', 'province'].includes(field))
          p = p.toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase());
        else p = p.charAt(0).toUpperCase() + p.slice(1);
        textBeforeRecordingRef.current += (textBeforeRecordingRef.current ? ' ' : '') + p;
        interimNow = '';
      } else interimNow = interim;
      const stream = textBeforeRecordingRef.current + (interimNow ? (textBeforeRecordingRef.current ? ' ' : '') + interimNow : '');
      applyTranscript(field, stream);
    };
    rec.onend = () => { if (isGlobalListeningRef.current) setTimeout(() => { if (isGlobalListeningRef.current) startGlobalRecognition(); }, 120); };
    try { rec.start(); } catch (e) {
      setTimeout(() => { if (isGlobalListeningRef.current) { try { rec.start(); } catch (err) {} } }, 500);
    }
  };

  const toggleGlobalListening = () => {
    if (isGlobalListeningRef.current) {
      isGlobalListeningRef.current = false;
      setIsGlobalListening(false);
      const r = globalRecognitionRef.current;
      if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
    } else {
      if (listeningFieldRef.current) { listeningFieldRef.current = null; setListeningField(null); try { recognitionRef.current?.stop(); } catch (e) {} }
      const f = activeFieldRef.current;
      textBeforeRecordingRef.current = f
        ? (f === 'appointmentContent' ? (newAppointment.content || '') : (formData[f] || ''))
        : '';
      isGlobalListeningRef.current = true;
      setIsGlobalListening(true);
      ensureSelectedMicStream().finally(() => startGlobalRecognition());
    }
  };

  const startRecognition = (field) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('Trình duyệt không hỗ trợ nhận diện giọng nói', 'error'); return; }
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true;
    recognitionRef.current = rec;
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) {
        let p = final;
        if (field === 'name') p = p.toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase());
        if (field === 'phone') p = p.replace(/\s+/g, '');
        textBeforeRecordingRef.current += (textBeforeRecordingRef.current ? ' ' : '') + p;
      }
      const stream = textBeforeRecordingRef.current + (interim ? (textBeforeRecordingRef.current ? ' ' : '') + interim : '');
      applyTranscript(field, stream);
    };
    rec.onend = () => { if (listeningFieldRef.current === field) { try { rec.start(); } catch (e) {} } };
    try { rec.start(); } catch (e) {}
  };

  const toggleListening = (field) => {
    if (listeningFieldRef.current === field) {
      listeningFieldRef.current = null; setListeningField(null);
      try { recognitionRef.current?.stop(); } catch (e) {}
    } else {
      try { recognitionRef.current?.stop(); } catch (e) {}
      textBeforeRecordingRef.current = field === 'appointmentContent' ? (newAppointment.content || '') : (formData[field] || '');
      listeningFieldRef.current = field; setListeningField(field);
      ensureSelectedMicStream().finally(() => startRecognition(field));
    }
  };

  const handleFocus = (field) => {
    activeFieldRef.current = field;
    if (isGlobalListeningRef.current) {
      textBeforeRecordingRef.current = field === 'appointmentContent' ? (newAppointment.content || '') : (formData[field] || '');
      startGlobalRecognition();
    }
  };

  /* ============== derived ============== */
  const myCustomers = useMemo(() => customers
    .filter(c => currentStaff ? c.salesRep === currentStaff.name : true)
    .filter(c => statusFilter ? c.status === statusFilter : true)
    .filter(c => {
      const q = searchTerm.toLowerCase().trim();
      if (!q) return true;
      return (c.name || '').toLowerCase().includes(q)
        || (c.phone || '').includes(q)
        || (c.contactPerson || '').toLowerCase().includes(q)
        || (c.province || '').toLowerCase().includes(q);
    })
    .sort((a, b) => {
      const oa = isCustomerOverdue(a) ? 0 : 1, ob = isCustomerOverdue(b) ? 0 : 1;
      if (oa !== ob) return oa - ob;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    }), [customers, currentStaff, searchTerm, statusFilter]);

  const todayStats = useMemo(() => {
    const today = getLocalDateString(new Date());
    const mine = customers.filter(c => currentStaff ? c.salesRep === currentStaff.name : true);
    return {
      total: mine.length,
      today: mine.filter(c => c.transactionDate === today).length,
      won: mine.filter(c => c.status === TransactionStatus.THANH_CONG || c.status === TransactionStatus.THANH_CONG_SP_MOI).length,
      overdue: mine.filter(isCustomerOverdue).length
    };
  }, [customers, currentStaff]);


  /* ============================== LOGIN ============================== */
  if (!isUnlocked) {
    return (
      <div className="h-full flex items-center justify-center p-5 relative overflow-hidden"
           style={{ background: 'linear-gradient(150deg,#0b2545 0%,#13315c 45%,#1d6fd0 100%)' }}>
        <div className="absolute -top-24 -right-20 w-80 h-80 rounded-full blur-3xl" style={{ background: 'rgba(61,155,233,.28)' }} />
        <div className="absolute -bottom-24 -left-16 w-72 h-72 rounded-full blur-3xl" style={{ background: 'rgba(15,157,118,.22)' }} />

        <div className={`relative z-10 w-full max-w-[400px] bg-white rounded-[28px] p-8 sm:p-10 shadow-pop ${loginShake ? 'shake' : 'pop-in'}`}>
          <div className="flex items-center gap-3 mb-8">
            <div className="w-12 h-12 rounded-2xl bg-ink text-white flex items-center justify-center shrink-0">
              <I.UserCheck width="22" height="22" />
            </div>
            <div className="leading-tight">
              <p className="font-display text-[19px] font-extrabold tracking-tight text-ink">IDECO</p>
              <p className="text-[10px] font-bold tracking-[.18em] uppercase text-emerald-600">Quản trị HUYỀN LIVE</p>
            </div>
          </div>

          <h1 className="font-display text-[19px] sm:text-[21px] leading-[1.28] font-extrabold text-ink mb-2">
            Khu vực <span className="text-jade">QUẢN TRỊ HUYỀN LIVE</span> — đọc dữ liệu khách hàng, phân tích AI riêng và chỉ phát thông báo khi quản lý chủ động bấm LIVE.
          </h1>
          <p className="text-[13px] text-slate-500 mb-7">Nhập mã quản trị để mở khu vực phân tích và phát LIVE.</p>

          <input
            type="password" autoFocus value={loginInput}
            onChange={e => setLoginInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleLogin()}
            placeholder="••••••••"
            className="fld text-center font-mono text-lg tracking-[.35em] py-4 mb-3"
          />

          <label className="flex items-center gap-2.5 mb-4 cursor-pointer select-none">
            <input type="checkbox" checked={rememberLogin}
                   onChange={e => {
                     const v = e.target.checked;
                     setRememberLogin(v);
                     try {
                       if (!v) { localStorage.removeItem('ideco_manager_live_savedPass'); localStorage.removeItem('ideco_manager_live_remember'); }
                       else localStorage.setItem('ideco_manager_live_remember', '1');
                     } catch (err) {}
                   }}
                   className="w-4 h-4 accent-[#1d6fd0] shrink-0" />
            <span className="text-[12.5px] font-semibold text-slate-500">Ghi nhớ mã quản trị trên máy này</span>
          </label>

          <button onClick={handleLogin}
            className="btn w-full py-4 bg-ink text-white text-[13px] tracking-[.14em] uppercase shadow-lift hover:bg-ink2">
            Truy cập hệ thống
          </button>

          <p className="text-[11px] text-slate-400 mt-6 text-center leading-relaxed">
            Quên mật khẩu? Liên hệ quản trị viên — đổi mật khẩu trong <span className="font-bold text-slate-500">Hệ thống → Bảo mật</span>.
          </p>
          <p className="text-[10.5px] text-slate-400 mt-3 text-center font-semibold tracking-wide">
            Ứng dụng được phát triển bởi: <span className="font-extrabold text-ink">MTRIET</span>
          </p>
        </div>
      </div>
    );
  }

  const locked = !IDECO_IS_MANAGER_LIVE && !!currentStaff?.isLocked;
  /* Ban ghi dang mo trong "Bao cao nhanh" luon lay ban moi nhat tu Firebase */
  const liveQuickReport = quickReportCustomer
    ? (customers.find(c => c.id === quickReportCustomer.id) || quickReportCustomer)
    : null;
  /* Nút Huyền gợi ý ngoài danh sách cũng luôn dùng bản khách hàng mới nhất từ Firebase */
  const liveAdvisorCustomer = advisorCustomer
    ? (customers.find(c => c.id === advisorCustomer.id) || advisorCustomer)
    : null;
  /* So gop y chua xem cua nhan vien dang dang nhap */
  const unseenFeedbackCount = currentStaff
    ? customers.filter(c => c.salesRep === currentStaff.name && c.feedback && c.feedback.text && !c.feedback.seenAt).length
    : 0;

  /* ============================== MAIN ============================== */
  return (
    <div className="h-full flex flex-col bg-paper overflow-hidden">

      <Popups
        celebrationQueue={celebrationQueue} setCelebrationQueue={setCelebrationQueue}
        performanceAlert={performanceAlert} setPerformanceAlert={setPerformanceAlert}
        showTargetPopup={showTargetPopup} targetGoal={targetGoal} setTargetGoal={setTargetGoal}
        handleConfirmTarget={handleConfirmTarget}
        targetWarning={targetWarning} setTargetWarning={setTargetWarning}
        quickReportCustomer={liveQuickReport} setQuickReportCustomer={setQuickReportCustomer}
        advisorCustomer={liveAdvisorCustomer} setAdvisorCustomer={setAdvisorCustomer}
        advisorMode={advisorMode}
        turboControl={turboControl}
        huyenTurbo={huyenTurbo}
        currentStaff={currentStaff}
        huyenPrimaryAi={huyenPrimaryAi}
        mgrUnlocked={mgrUnlocked} setMgrUnlocked={setMgrUnlocked}
        onSaveFeedback={handleSaveFeedback} onDeleteFeedback={handleDeleteFeedback}

                    <input value={newAppointment.content} onFocus={() => handleFocus('appointmentContent')}
                      onChange={e => setNewAppointment({ ...newAppointment, content: e.target.value })}
                      placeholder="VD: Gọi điện tư vấn lại..." className="fld bg-white" />
                  </Field>
                  <button onClick={handleAddAppointment} className="btn w-full py-3 bg-ink text-white text-[13px] uppercase tracking-wider">
                    <I.Plus width="15" height="15" /> Lập lịch hẹn
                  </button>
                </div>

                <div className="space-y-2 mt-4">
                  {(formData.appointments || []).map(a => {
                    const past = a.date < getLocalDateString(new Date());
                    return (
                      <div key={a.id} className={`spine rounded-2xl border p-4 pl-5 flex items-center gap-3 ${a.isCompleted ? 'bg-paper border-transparent opacity-50' : 'bg-white border-line'}`}
                           style={{ '--spine': a.isCompleted ? '#cbd5e1' : (past ? '#d8324b' : '#1d6fd0') }}>
                        <div className="flex-1 min-w-0">
                          <p className="font-mono font-bold text-[13px] text-ink">{viDate(a.date)} · {a.time}</p>
                          <p className="text-[12.5px] text-slate-500 mt-0.5">{a.content}</p>
                        </div>
                        <button onClick={() => setFormData({ ...formData, appointments: formData.appointments.filter(x => x.id !== a.id) })}
                          className="btn w-9 h-9 bg-rose-50 text-crimson shrink-0"><I.Trash width="15" height="15" /></button>
                      </div>
                    );
                  })}
                  {(formData.appointments || []).length === 0 && (
                    <p className="text-center text-[12.5px] text-slate-400 py-4">Chưa có lịch hẹn. Thêm một lịch hẹn để lưu được hồ sơ.</p>
                  )}
                </div>
              </section>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}


/* ============================== POPUPS ============================== */
function Popups({
  celebrationQueue, setCelebrationQueue,
  performanceAlert, setPerformanceAlert,
  showTargetPopup, targetGoal, setTargetGoal, handleConfirmTarget,
  targetWarning, setTargetWarning,
  quickReportCustomer, setQuickReportCustomer,
  advisorCustomer, setAdvisorCustomer, advisorMode,
  turboControl, huyenTurbo, huyenPrimaryAi, currentStaff,
  mgrUnlocked, setMgrUnlocked,
  onSaveFeedback, onDeleteFeedback, notify
}) {
  const firedRef = useRef(null);

  /* ================= GOP Y CUA CAP QUAN LY / BAN GIAM DOC ================= */
  const fb = (quickReportCustomer && quickReportCustomer.feedback && quickReportCustomer.feedback.text)
    ? quickReportCustomer.feedback : null;

  const [fbEditing, setFbEditing] = useState(false);
  const [fbText, setFbText]       = useState('');
  const [fbGate, setFbGate]       = useState(false);
  const [fbPass, setFbPass]       = useState('');
  const [fbShake, setFbShake]     = useState(false);
  const [fbSaving, setFbSaving]   = useState(false);
  const [fbListening, setFbListening] = useState(false);
  const fbRecRef  = useRef(null);
  const fbBaseRef = useRef('');

  /* AI co van tren HO SO DA LUU MOI NHAT */
  const [advisorBusy, setAdvisorBusy] = useState(false);
  const [advisorResult, setAdvisorResult] = useState(null);
  const [advisorError, setAdvisorError] = useState('');

  /* Trạng thái nâng cao được chọn ở DANH SÁCH HỒ SƠ và truyền vào popup.
     Popup không còn nút bật/tắt để tránh bật nhầm sau khi đã chọn kiểu phân tích. */
  const normalAiLabel = 'chế độ thường';

  const runAdvisor = async () => {
    if (!quickReportCustomer) return;
    setAdvisorBusy(true); setAdvisorError(''); setAdvisorResult(null);
    try {
      const r = await analyzeLatestCustomerStrategy(quickReportCustomer, { turbo: huyenTurbo });
      setAdvisorResult(r);
    } catch (e) {
      const msg = String(e && e.message || e);
      setAdvisorError(huyenTurbo
        ? 'HUYỀN PHÂN TÍCH NÂNG CAO đã thử tuyến nâng cao và tự chuyển qua các API dự phòng nhưng vẫn chưa kết nối được. Bạn vui lòng thử lại sau ít phút.'
        : (msg === 'NO_KEY' ? 'Chưa có API AI. Vào Hệ thống → Cài đặt AI để nhập API dự phòng.' : `Huyền đã tự nối lại nhưng chưa hoàn tất phân tích bằng ${normalAiLabel} và phương án dự phòng. Bạn thử lại khi mạng ổn định hơn.`));
    } finally { setAdvisorBusy(false); }
  };

  /* Cố vấn mở trực tiếp từ thẻ khách hàng: mở là tự phân tích, không cần bấm lần hai */
  const [directAdvisorBusy, setDirectAdvisorBusy] = useState(false);
  const [directAdvisorResult, setDirectAdvisorResult] = useState(null);
  const [directAdvisorError, setDirectAdvisorError] = useState('');
  const [directAdvisorMinimized, setDirectAdvisorMinimized] = useState(false);


  /* ================= HUYỀN LIVE — gửi kết quả + nhận lại cho đúng nhân viên ================= */
  const [livePublishing, setLivePublishing] = useState(false);
  const [liveNotice, setLiveNotice] = useState(null);
  const [liveAckBusy, setLiveAckBusy] = useState(false);
  const [liveAckError, setLiveAckError] = useState('');

  const sendAdvisorLive = async (customer, result, mode) => {
    if (!IDECO_CAN_PUBLISH_HUYEN_LIVE) { notify && notify('LIVE chỉ có trong ứng dụng quản trị.', 'warning', 4200); return; }
    if (!customer || !result || livePublishing) return;
    setLivePublishing(true);
    try {
      const sent = await publishHuyenLiveAnalysis(customer, result, mode);
      notify && notify(`Đã phát Live cho ${sent.staffName}. Widget HUYỀN LIVE sẽ nhận qua Firebase; trên website khác thường hiện trong tối đa khoảng 10 giây. Người vào sau vẫn nhận nếu máy đó chưa bấm Đã hiểu.`, 'success', 6500);
    } catch (e) {
      notify && notify(String(e?.message || e || 'Chưa gửi được Live.'), 'error', 6500);
    } finally { setLivePublishing(false); }
  };

  /* Người vào sau thời điểm phát Live vẫn nhận: sau 10 giây kiểm tra, rồi lặp mỗi 10 giây.
     Bản V2 không so tên theo chuỗi tuyệt đối nữa; đường dẫn staffKey đã là hộp thư riêng của nhân viên. */
  useEffect(() => {
    if (!IDECO_INTERNAL_LIVE_RECEIVER) { setLiveNotice(null); setLiveAckError(''); return () => {}; }
    let dead = false, timer = null, interval = null;
    const staffName = huyenLiveCanonicalStaffName(currentStaff?.name || '');
    setLiveNotice(null); setLiveAckError('');
    if (!staffName) return () => {};
    const staffKey = huyenLiveStaffKey(staffName);

    const payloadCaseKey = (x) => String(x?.caseKey || huyenLiveCaseKey(x?.staffName || staffName, x?.customerId, x?.customerName));
    const acceptPayload = (x) => {
      if (!x || x.acknowledgedAt) return false;
      if (x.staffKey && String(x.staffKey) !== staffKey) return false;
      const ck = payloadCaseKey(x);
      const ackAt = huyenLiveCaseAckAt(ck);
      if (ackAt && (!x.createdAt || Number(x.createdAt) <= ackAt)) return false;
      return true;
    };
    const check = async () => {
      try {
        const raw = await dbGet(`huyenLive/${staffKey}`);
        if (dead || !raw || typeof raw !== 'object') return;
        const byCase = {};
        Object.values(raw).filter(acceptPayload).forEach(x => {
          const ck = payloadCaseKey(x);
          if (!byCase[ck] || Number(x.createdAt || 0) > Number(byCase[ck].createdAt || 0)) byCase[ck] = { ...x, caseKey: ck };
        });
        const pending = Object.values(byCase).sort((a,b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
        setLiveNotice(prev => {
          if (prev && acceptPayload(prev)) return prev;
          return pending[0] || null;
        });
      } catch (e) { /* im lặng, vòng sau thử lại */ }
    };
    const onPublished = (ev) => {
      const x = ev?.detail;
      if (dead) return;
      if (x && acceptPayload(x) && huyenLiveStaffKey(x.staffName || '') === staffKey) {
        const item = { ...x, caseKey: payloadCaseKey(x) };
        setLiveNotice(prev => (prev && acceptPayload(prev)) ? prev : item);
      } else setTimeout(check, 150);
    };
    try { window.addEventListener('ideco:huyen-live-published', onPublished); } catch (e) {}
    timer = setTimeout(() => { check(); interval = setInterval(check, 10000); }, 10000);
    return () => {
      dead = true; clearTimeout(timer); if (interval) clearInterval(interval);
      try { window.removeEventListener('ideco:huyen-live-published', onPublished); } catch (e) {}
    };
  }, [currentStaff?.name]);

  const acknowledgeLiveNotice = async () => {
    if (!liveNotice || liveAckBusy) return;
    const staffName = huyenLiveCanonicalStaffName(liveNotice.staffName || currentStaff?.name || '');
    if (!staffName) return;
    const staffKey = String(liveNotice.staffKey || huyenLiveStaffKey(staffName));
    const caseKey = String(liveNotice.caseKey || huyenLiveCaseKey(staffName, liveNotice.customerId, liveNotice.customerName));
    const ackAt = Date.now();
    setLiveAckBusy(true); setLiveAckError('');
    try {
      const ok = await dbUpdate(`huyenLive/${staffKey}/${liveNotice.id}`, {
        acknowledgedAt: ackAt, acknowledgedBy: huyenLiveCanonicalStaffName(currentStaff?.name || staffName), caseKey
      });
      if (!ok) throw new Error('Chưa ghi nhận được “Đã hiểu”. Vui lòng kiểm tra mạng và bấm lại.');
      /* Một lần Đã hiểu sẽ loại toàn bộ Live cũ/trùng của đúng NV + KH trên máy này. */
      huyenLiveMarkCaseAck(caseKey, ackAt);
      setLiveNotice(null);
    } catch (e) { setLiveAckError(String(e?.message || e)); }
    finally { setLiveAckBusy(false); }
  };

  /* Mở khách hàng mới thì hiện popup đầy đủ; thu nhỏ không làm mất advisorCustomer nên request vẫn tiếp tục. */
  useEffect(() => {
    if (advisorCustomer) setDirectAdvisorMinimized(false);
  }, [advisorCustomer ? advisorCustomer.id : null]);

  const closeOrMinimizeDirectAdvisor = () => {
    if (directAdvisorBusy) {
      setDirectAdvisorMinimized(true);
      notify && notify('Huyền vẫn đang phân tích ở góc màn hình. Bạn có thể tiếp tục làm việc khác.', 'info', 4500);
      return;
    }
    setDirectAdvisorMinimized(false);
    setAdvisorCustomer(null);
  };

  useEffect(() => {
    let cancelled = false;
    const run = async () => {
      if (!advisorCustomer) {
        setDirectAdvisorBusy(false); setDirectAdvisorResult(null); setDirectAdvisorError('');
        return;
      }
      setDirectAdvisorBusy(true); setDirectAdvisorResult(null); setDirectAdvisorError('');
      try {
        const r = await analyzeLatestCustomerStrategy(advisorCustomer, { turbo: huyenTurbo, mode: advisorMode });
        if (!cancelled) setDirectAdvisorResult(r);
      } catch (e) {
        if (cancelled) return;
        const msg = String(e && e.message || e);
        setDirectAdvisorError(huyenTurbo
          ? 'Huyền đã tự nối lại và chuyển qua API dự phòng nhưng kết nối vẫn chưa ổn định. Bạn bấm Thử phân tích lại khi mạng ổn định hơn.'
          : (msg === 'NO_KEY' ? 'Chưa có API AI. Vào Hệ thống → Cài đặt AI để nhập API dự phòng.' : `Huyền chưa phân tích được bằng ${normalAiLabel} và phương án dự phòng. Bạn thử lại sau ít phút.`));
      } finally { if (!cancelled) setDirectAdvisorBusy(false); }
    };
    run();
    return () => { cancelled = true; };
  }, [advisorCustomer ? advisorCustomer.id : null, advisorCustomer ? advisorCustomer.updatedAt : null, advisorMode, huyenTurbo, huyenPrimaryAi]);

  /* Nếu Huyền đang thu nhỏ, báo khi có kết quả/lỗi mà không kéo người dùng ra khỏi việc đang làm. */
  useEffect(() => {
    if (!advisorCustomer || !directAdvisorMinimized) return;
    if (directAdvisorResult) {
      notify && notify(`Huyền đã phân tích xong ${advisorCustomer.name}. Bấm khung Huyền ở góc màn hình để xem.`, 'success', 6500);
    } else if (directAdvisorError && !directAdvisorBusy) {
      notify && notify('Phiên phân tích bị gián đoạn sau khi đã tự nối lại. Bấm khung Huyền ở góc để thử lại.', 'warning', 6500);
    }
  }, [directAdvisorResult, directAdvisorError, directAdvisorBusy, directAdvisorMinimized]);

  const rerunDirectAdvisor = async () => {
    if (!advisorCustomer) return;
    setDirectAdvisorBusy(true); setDirectAdvisorResult(null); setDirectAdvisorError('');
    try {
      const r = await analyzeLatestCustomerStrategy(advisorCustomer, { turbo: huyenTurbo, mode: advisorMode });
      setDirectAdvisorResult(r);
    } catch (e) {
      const msg = String(e && e.message || e);
      setDirectAdvisorError(huyenTurbo
        ? 'HUYỀN PHÂN TÍCH NÂNG CAO chưa kết nối được. Huyền đã tự chuyển sang chế độ thường và các API dự phòng; bạn cũng có thể thử lại sau.'
        : (msg === 'NO_KEY' ? 'Chưa có API key AI. Vào Hệ thống → Cài đặt AI để nhập key.' : `Huyền chưa phân tích được bằng ${normalAiLabel}. Kiểm tra kết nối/API key rồi thử lại.`));
    } finally { setDirectAdvisorBusy(false); }
  };


  const stopFbMic = () => {
    const r = fbRecRef.current;
    fbRecRef.current = null;
    if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
    setFbListening(false);
  };

  const startFbMic = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify && notify('Trình duyệt không hỗ trợ nhận diện giọng nói', 'error'); return; }
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true; rec.continuous = true;
    fbBaseRef.current = fbText || '';
    let interimNow = '';
    rec.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) {
        const p = final.charAt(0).toUpperCase() + final.slice(1);
        fbBaseRef.current += (fbBaseRef.current ? ' ' : '') + p;
        interimNow = '';
      } else interimNow = interim;
      setFbText(fbBaseRef.current + (interimNow ? (fbBaseRef.current ? ' ' : '') + interimNow : ''));
    };
    rec.onend = () => { if (fbRecRef.current === rec) { try { rec.start(); } catch (e) {} } };
    fbRecRef.current = rec; setFbListening(true);
    try { rec.start(); } catch (e) {}
  };

  const toggleFbMic = () => { if (fbRecRef.current) stopFbMic(); else startFbMic(); };

  /* Doi ho so -> dong o soan thao, nap lai noi dung */
  useEffect(() => {
    stopFbMic();
    setFbEditing(false); setFbGate(false); setFbPass(''); setFbSaving(false);
    setAdvisorResult(null); setAdvisorError(''); setAdvisorBusy(false);
    setFbText((quickReportCustomer && quickReportCustomer.feedback && quickReportCustomer.feedback.text) || '');
    return () => stopFbMic();
  }, [quickReportCustomer ? quickReportCustomer.id : null]);

  const fbWhen = (t) => {
    try {
      return new Date(t).toLocaleString('vi-VN',
        { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch (e) { return ''; }
  };

  const openFbEditor = () => {
    /* Nâng cấp: từ danh sách khách hàng -> Báo cáo nhanh -> Góp ý không hỏi lại mật khẩu */
    setFbGate(false); setFbPass('');
    setFbText(fb ? fb.text : ''); setFbEditing(true);
  };

  const tryUnlockFb = () => {
    if (fbPass === MASTER_KEY) {
      setMgrUnlocked(true); setFbGate(false); setFbPass('');
      setFbText(fb ? fb.text : ''); setFbEditing(true);
      notify && notify('Đã mở quyền góp ý cho phiên làm việc này', 'success', 2600);
    } else {
      setFbShake(true); setTimeout(() => setFbShake(false), 520);
      notify && notify('Mã bảo mật không đúng!', 'error');
    }
  };

  const doSaveFb = async () => {
    if (!quickReportCustomer) return;
    stopFbMic(); setFbSaving(true);
    const ok = await onSaveFeedback(quickReportCustomer.id, fbText);
    setFbSaving(false);
    if (ok) { setFbEditing(false); setQuickReportCustomer(null); }
  };

  const doDeleteFb = async () => {
    if (!quickReportCustomer) return;
    stopFbMic();
    if (!fb) { setFbEditing(false); setFbText(''); return; }
    setFbSaving(true);
    const ok = await onDeleteFeedback(quickReportCustomer.id);
    setFbSaving(false);
    if (ok) { setFbEditing(false); setFbText(''); }
  };

  const markSeen = (id) => {
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('seenCelebrationIds') || '[]'); } catch (e) {}
    if (!seen.includes(id)) {
      seen.push(id);
      if (seen.length > 100) seen.shift();
      localStorage.setItem('seenCelebrationIds', JSON.stringify(seen));
    }
  };

  const dismissCelebration = () => {
    if (!celebrationQueue.length) return;
    markSeen(celebrationQueue[0].id);
    setCelebrationQueue(prev => prev.slice(1));
  };

  useEffect(() => {
    if (!celebrationQueue.length) return;
    const cur = celebrationQueue[0];
    if (firedRef.current !== cur.id) { firedRef.current = cur.id; burstConfetti(); }
    const t = setTimeout(dismissCelebration, 6000);
    return () => clearTimeout(t);
  }, [celebrationQueue]);

  return (
    <React.Fragment>
      {/* celebration */}
      <Modal open={celebrationQueue.length > 0} z={1100} max="max-w-md">
        {celebrationQueue.length > 0 && (
          <div className="p-8 text-center relative overflow-hidden rounded-[26px]">
            <div className="absolute inset-x-0 top-0 h-1.5" style={{ background: 'linear-gradient(90deg,#e08a1e,#f5c451,#e08a1e)' }} />
            <Ring color="bg-amber-50 text-amber2" icon={<I.Trophy width="28" height="28" />} />
            <p className="lbl">Vinh danh chiến binh</p>
            <p className="font-display text-[30px] font-extrabold text-ink leading-tight mt-1 mb-2">{celebrationQueue[0].staffName}</p>
            <p className="text-[13.5px] text-slate-500 mb-5">
              Đã chốt thành công khách hàng <span className="font-bold text-ink">{celebrationQueue[0].customerName}</span>. Ban giám đốc chúc mừng Em!
            </p>
            <div className="spine bg-emerald-50/70 rounded-2xl p-4 pl-5 text-left mb-6" style={{ '--spine': '#0f9d76' }}>
              <p className="text-[12.5px] font-bold text-emerald-800 leading-relaxed uppercase">
                "Chúc mừng bạn đã chốt thành công, mong bạn phát huy và duy trì tốt phát triển khách hàng. Ban giám đốc chúc mừng Em!"
              </p>
            </div>
            <button onClick={dismissCelebration} className="btn w-full py-4 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift">
              Tuyệt vời — xin chúc mừng {celebrationQueue.length > 1 ? `(còn ${celebrationQueue.length - 1})` : ''}
            </button>
          </div>
        )}
      </Modal>

      {/* performance */}
      <Modal open={!!performanceAlert && celebrationQueue.length === 0} z={1060} max="max-w-md">
        {performanceAlert && (
          <div className="p-8 text-center">
            <Ring color="bg-amber-50 text-amber2" icon={<I.BarChart width="26" height="26" />} />
            <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Nhắc nhở hiệu suất</h3>
            <div className="spine bg-amber-50/60 rounded-2xl p-4 pl-5 text-left mb-5" style={{ '--spine': '#e08a1e' }}>
              <p className="font-bold text-ink text-[13.5px] mb-1.5">Hệ thống ghi nhận bạn khai thác khách hàng hôm qua quá ít!</p>
              <p className="text-[12.5px] text-slate-600 leading-relaxed">Dưới 3 khách hàng là mức báo động. Nếu không tăng số lượng lên, bạn sẽ rất khó đạt chỉ tiêu doanh thu tháng này!</p>
            </div>
            <p className="lbl">Nhân viên cần nỗ lực</p>
            <div className="flex flex-wrap justify-center gap-2 mb-7 max-h-28 overflow-y-auto">
              {performanceAlert.map(n => (
                <span key={n} className="px-3 py-1.5 bg-paper rounded-xl text-[12px] font-bold text-slate-600">{n}</span>
              ))}
            </div>
            <button onClick={() => setPerformanceAlert(null)} className="btn w-full py-4 bg-ink text-white text-[13px] uppercase tracking-wider">Tôi sẽ cố gắng hơn</button>
          </div>
        )}
      </Modal>

      {/* target goal */}
      <Modal open={showTargetPopup} z={1090} max="max-w-md">
        <div className="p-8 text-center">
          <Ring color="bg-blue-50 text-brand" icon={<I.Target width="26" height="26" />} />
          <h3 className="font-display text-[19px] font-extrabold text-ink mb-4">Mục tiêu hôm nay</h3>
