                    )}
                    {advisorResult.managementSupport && (
                      <div className="rounded-xl bg-slate-50 border border-line p-3.5 text-[11.5px] text-slate-600 leading-relaxed"><b className="text-ink">BGĐ nên hỗ trợ:</b> {advisorResult.managementSupport}</div>
                    )}
                    {advisorResult.nextFollowUp && (
                      <div className="rounded-xl bg-blue-50/70 border border-blue-100 p-3.5 text-[11.5px] text-slate-600 leading-relaxed"><b className="text-brand">Theo dõi tiếp:</b> {advisorResult.nextFollowUp}</div>
                    )}
                    {advisorResult.timelineAssessment && (
                      <div className="rounded-xl bg-blue-50/70 border border-blue-100 p-3.5 text-[11.5px] text-slate-600 leading-relaxed"><b className="text-brand">Đánh giá thời gian giao dịch:</b> {advisorResult.timelineAssessment}</div>
                    )}
                    {advisorResult.relationshipDecision && (
                      <div className={`rounded-xl border p-3.5 ${String(advisorResult.relationshipDecision).includes('Chú Triết') ? 'bg-rose-50 border-rose-200' : 'bg-amber-50 border-amber-200'}`}>
                        <p className="text-[10.5px] font-extrabold uppercase tracking-wide text-slate-500 mb-1">Đề nghị bước tiếp theo</p>
                        <p className="text-[12.5px] font-extrabold text-ink leading-relaxed">{advisorResult.relationshipDecision}</p>
                        {advisorResult.talkToTriet?.reason && <p className="text-[11.5px] text-slate-600 mt-1.5 leading-relaxed">{advisorResult.talkToTriet.reason}</p>}
                        {advisorResult.talkToTriet?.needed && advisorResult.talkToTriet?.ask && <p className="text-[11.5px] font-bold text-crimson mt-1.5 leading-relaxed">Cần trao đổi Chú Triết: {advisorResult.talkToTriet.ask}</p>}
                      </div>
                    )}
                    {Array.isArray(advisorResult.knowledgeUsed) && advisorResult.knowledgeUsed.length > 0 && (
                      <div className="text-[10.5px] text-slate-400 leading-relaxed"><b>Kho nội bộ đã tham chiếu:</b> {advisorResult.knowledgeUsed.join(' · ')}</div>
                    )}
                    {advisorResult.finalAdvice && (
                      <div className="spine rounded-xl bg-violet-100/60 p-3.5 pl-5" style={{ '--spine':'#6d4de0' }}>
                        <p className="text-[10.5px] font-extrabold uppercase tracking-wide text-violet2 mb-1">Đề xuất tốt nhất</p>
                        <p className="text-[12.5px] font-bold text-ink leading-relaxed">{advisorResult.finalAdvice}</p>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {(quickReportCustomer.appointments || []).length > 0 && (
                <div>
                  <p className="lbl">Lịch hẹn</p>
                  <div className="space-y-2">
                    {quickReportCustomer.appointments.map(a => (
                      <div key={a.id} className={`spine rounded-2xl p-3.5 pl-5 border ${a.isCompleted ? 'bg-paper border-transparent opacity-60' : 'bg-white border-line'}`}
                           style={{ '--spine': a.isCompleted ? '#cbd5e1' : '#e08a1e' }}>
                        <p className="font-mono font-bold text-[12.5px] text-ink">{viDate(a.date)} · {a.time}</p>
                        <p className="text-[12.5px] text-slate-500 mt-0.5">{a.content}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div>
                <p className="lbl">Lời khuyên từ IDECO</p>
                <div className="spine bg-amber-50/40 rounded-2xl p-4 pl-5" style={{ '--spine': '#e08a1e' }}>
                  <p className="text-[12.5px] text-slate-600 italic leading-relaxed">
                    Báo cáo này đã được AI tối ưu để đảm bảo tính chuyên nghiệp và rõ ràng cho Ban Giám đốc.
                  </p>
                </div>
              </div>
            </div>

            <button onClick={() => setQuickReportCustomer(null)} className="btn w-full py-4 mt-5 bg-ink text-white text-[13px] uppercase tracking-wider shrink-0">Đóng cửa sổ</button>
          </div>
        )}
      </Modal>

      {/* HUYỀN LIVE — popup bắt buộc bấm "Đã hiểu" mới tắt; không có nút X, không đóng bằng backdrop. */}
      {IDECO_INTERNAL_LIVE_RECEIVER && liveNotice && (
        <div className="fixed inset-0 z-[2300] bg-slate-950/70 backdrop-blur-[3px] flex items-center justify-center p-3 sm:p-5">
          <div className="w-full max-w-3xl max-h-[92vh] bg-white rounded-[26px] shadow-pop border border-amber-200 overflow-hidden fade-in">
            <div className="px-5 sm:px-7 py-5 bg-gradient-to-r from-amber-50 via-white to-blue-50 border-b border-line">
              <div className="flex items-start gap-3">
                <div className="w-11 h-11 rounded-2xl bg-amber2 text-white flex items-center justify-center shrink-0 shadow-soft"><I.Sparkles width="21" height="21" /></div>
                <div className="min-w-0 flex-1">
                  <p className="text-[10.5px] font-extrabold uppercase tracking-[.12em] text-amber2">HUYỀN LIVE · THÔNG BÁO TỪ BGĐ</p>
                  <h3 className="font-display text-[17px] sm:text-[20px] font-extrabold text-ink leading-snug mt-1">
                    Bạn {liveNotice.staffName}, Huyền được phân công BGĐ gởi bạn phần nội dung gợi ý xử lý về khách hàng mới mà bạn đang giao dịch, bạn xem lại và tìm cách chốt:
                  </h3>
                  {liveNotice.customerName && <p className="text-[12px] font-bold text-brand mt-2">Khách hàng: {liveNotice.customerName}</p>}
                </div>
              </div>
            </div>
            <div className="px-5 sm:px-7 py-5 overflow-y-auto max-h-[64vh]">
              <div className="whitespace-pre-wrap text-[13px] sm:text-[14px] leading-[1.72] text-slate-700 font-medium">{liveNotice.content}</div>
            </div>
            <div className="px-5 sm:px-7 py-4 border-t border-line bg-paper">
              {liveAckError && <p className="text-[11.5px] font-bold text-crimson mb-2 text-center">{liveAckError}</p>}
              <button onClick={acknowledgeLiveNotice} disabled={liveAckBusy}
                className="btn w-full py-4 bg-ink text-white text-[13px] uppercase tracking-[.08em] shadow-lift disabled:opacity-60">
                {liveAckBusy ? 'Đang ghi nhận…' : 'Đã hiểu'}
              </button>
              <p className="text-[10.5px] text-slate-400 text-center mt-2">Thông báo chỉ tắt sau khi hệ thống ghi nhận bạn đã hiểu.</p>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

/* ============================== MOUNT ============================== */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

<script>
(function () {
  function fatal(msg, detail) {
    document.getElementById('root').innerHTML =
      '<div style="max-width:560px;margin:12vh auto;padding:28px;font-family:system-ui;background:#fff;'
      + 'border-radius:20px;box-shadow:0 20px 50px -20px rgba(11,37,69,.4)">'
      + '<h2 style="margin:0 0 10px;font-size:19px;color:#0b2545">Khong tai duoc ung dung</h2>'
      + '<p style="margin:0 0 14px;font-size:14px;color:#5b6b86">' + msg + '</p>'
      + '<pre style="white-space:pre-wrap;font-size:12px;color:#d8324b;background:#fff5f6;padding:12px;border-radius:10px">'
      + (detail || '') + '</pre></div>';
  }
  try {
    if (!window.Babel) { fatal('Thieu thu vien Babel. Kiem tra ket noi mang roi tai lai trang.', ''); return; }
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]], filename: 'app.jsx' }).code;
    (0, eval)(out);
  } catch (e) {
    fatal('Loi khi khoi tao ung dung.', (e && (e.message || e)) + '');
    console.error(e);
  }
})();
</script>
</body>
</html>
