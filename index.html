/* fetch co gioi han thoi gian -> KHONG BAO GIO treo vo han khi mang chap chon */
async function fetchTimeout(url, opts = {}, ms = 20000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    return await fetch(url, { ...opts, signal: ctl.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function dbSet(path, value) {
  if (FB_READY) {
    try { await FBDB.ref(path).set(value); return true; }
    catch (e) { console.error('dbSet(SDK)', e); }
  }
  try {
    const r = await fetchTimeout(dbUrl(path), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) });
    return r.ok;
  } catch (e) { console.error('dbSet', e); return false; }
}
async function dbUpdate(path, value) {
  if (FB_READY) {
    try { await FBDB.ref(path).update(value); return true; }
    catch (e) { console.error('dbUpdate(SDK)', e); }
  }
  try {
    const r = await fetchTimeout(dbUrl(path), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) });
    return r.ok;
  } catch (e) { console.error('dbUpdate', e); return false; }
}
/* Ghi 1 lo co thu lai nhieu lan — TRA VE LY DO THAT SU khi that bai */
async function dbUpdateDetailed(path, value, tries = 3, ms = 25000) {
  /* --- Duong chinh: SDK (WebSocket) --- */
  if (FB_READY) {
    for (let t = 0; t < tries; t++) {
      try {
        await Promise.race([
          FBDB.ref(path).update(value),
          new Promise((_, rej) => setTimeout(() => rej(new Error('SDK_TIMEOUT')), ms))
        ]);
        return { ok: true, via: 'SDK' };
      } catch (e) {
        const msg = String((e && (e.message || e.code)) || e);
        if (/permission|denied/i.test(msg)) {
          return { ok: false, err: `Firebase SDK: ${msg}`, fatal: true,
                   hint: 'Database Rules đang chặn ghi. Vào Firebase Console → Realtime Database → Rules, đặt ".write": true rồi bấm Publish.' };
        }
        if (t === tries - 1) { console.warn('[IDECO] SDK ghi lỗi, chuyển sang REST:', msg); break; }
        await new Promise(res => setTimeout(res, 800 * Math.pow(2, t)));
      }
    }
  }

  /* --- Du phong: REST --- */
  let lastErr = 'Không rõ nguyên nhân';
  for (let t = 0; t < tries; t++) {
    try {
      const r = await fetchTimeout(dbUrl(path), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(value)
      }, ms);
      if (r.ok) return { ok: true, via: 'REST' };

      /* Doc thong bao loi that cua Firebase */
      let body = '';
      try { body = (await r.text()).slice(0, 300); } catch (e) {}
      lastErr = `HTTP ${r.status}${body ? ' — ' + body : ''}`;

      if (r.status === 401 || r.status === 403) {
        return { ok: false, err: lastErr, code: r.status, fatal: true,
                 hint: 'Database Rules đang chặn ghi. Vào Firebase Console → Realtime Database → Rules, đặt ".write": true rồi Publish.' };
      }
      if (r.status === 404) {
        return { ok: false, err: lastErr, code: 404, fatal: true,
                 hint: 'Sai databaseURL — kiểm tra lại địa chỉ Realtime Database (chú ý vùng, ví dụ ...-default-rtdb.asia-southeast1.firebasedatabase.app).' };
      }
      if (r.status === 413) {
        return { ok: false, err: lastErr, code: 413, fatal: true,
                 hint: 'Gói dữ liệu quá lớn — hãy giảm số dòng mỗi lô.' };
      }
      if (r.status >= 400 && r.status < 500 && r.status !== 429) {
        return { ok: false, err: lastErr, code: r.status, fatal: true,
                 hint: 'Firebase từ chối dữ liệu. Xem chi tiết lỗi ở trên.' };
      }
    } catch (e) {
      lastErr = e.name === 'AbortError'
        ? `Quá thời gian chờ ${Math.round(ms / 1000)}s (mạng chậm hoặc bị chặn)`
        : `${e.name}: ${e.message}`;
      /* TypeError = bi CORS / tuong lua / chan mang chan hoan toan */
      if (e instanceof TypeError && t === tries - 1) {
        return { ok: false, err: lastErr, fatal: true,
                 hint: 'Trình duyệt không gửi được yêu cầu. Thường do: mở file bằng file:// thay vì http, tường lửa/VPN công ty chặn firebaseio.com, hoặc tiện ích chặn quảng cáo.' };
      }
    }
    if (t < tries - 1) await new Promise(res => setTimeout(res, 800 * Math.pow(2, t)));
  }
  return { ok: false, err: lastErr, hint: 'Mạng không ổn định — thử lại khi đường truyền tốt hơn.' };
}

async function dbGet(path) {

    catch (e) { console.error('dbGet(SDK)', e); }

/** Co the tam dung moi listener khi dang upload lo lon -> tranh nghen mang */
const RT = { paused: false, pending: new Set(), guard: null };
function rtPause()  {
  RT.paused = true;
  /* Chot an toan: du co loi bat ngo, realtime luon tu bat lai sau 3 phut */
  clearTimeout(RT.guard);
  RT.guard = setTimeout(() => { if (RT.paused) rtResume(); }, 180000);
}
function rtResume() {
  clearTimeout(RT.guard); RT.guard = null;
  RT.paused = false;
  RT.pending.forEach(fn => { try { fn(); } catch (e) {} });
  RT.pending.clear();
}

/** Realtime subscription via EventSource (Firebase REST streaming). */
function dbOnValue(path, cb) {
  let es = null, dead = false, poll = null, last = null, fbRef = null, fbHandler = null;
  const emit = (v) => {
    const s = JSON.stringify(v);
    if (s !== last) { last = s; cb(v); }
  };

  /* ---- Duong chinh: SDK onValue (giong het ban goc) ---- */
  if (FB_READY) {
    try {
      fbRef = FBDB.ref(path);
      fbHandler = fbRef.on('value', (snap) => {
        if (dead) return;
        const v = snap.exists() ? snap.val() : null;
        /* Dang upload -> hoan lai de khong ve lai giao dien lien tuc */
        if (RT.paused) { RT.pending.add(() => { if (!dead) emit(v); }); return; }
        emit(v);
      }, (err) => { console.error('[IDECO] onValue lỗi:', path, err); });
      return () => {
        dead = true;
        try { fbRef.off('value', fbHandler); } catch (e) {}
      };
    } catch (e) { console.error('[IDECO] Không đăng ký được onValue:', e); }
  }

  /* ---- Du phong: EventSource / polling qua REST ---- */
  const refresh = async () => { if (!dead) emit(await dbGet(path)); };
  const onChange = () => {
    if (dead) return;
    if (RT.paused) { RT.pending.add(refresh); return; }
    refresh();
  };
  const startPoll = () => {
    if (poll) return;
    onChange();
    poll = setInterval(onChange, 12000);
  };
  try {
    es = new EventSource(dbUrl(path));
    es.addEventListener('put', onChange);
    es.addEventListener('patch', onChange);
    es.onerror = () => { startPoll(); };
    dbGet(path).then(v => { if (!dead) emit(v); });
  } catch (e) { startPoll(); }
  return () => {
    dead = true;
    if (es) try { es.close(); } catch (e) {}
    if (poll) clearInterval(poll);
  };
}

function baiAuthHeaders(key, mode = 'bearer', withJson = true) {

function baiFriendlyError(err) {
  const raw = String(err?.message || err || 'Không rõ lỗi');
  if (/BAI_BROWSER_FETCH_FAILED|Failed to fetch|NetworkError|Load failed/i.test(raw)) {
    const proto = (typeof location !== 'undefined' && location.protocol) ? location.protocol : '';
    return proto === 'file:'
      ? 'Trình duyệt không gọi được api.b.ai từ file:// (khả năng CORS/mạng). Hãy chạy ứng dụng qua http/https hoặc dùng B.AI Bridge/backend.'
      : 'Trình duyệt không kết nối được api.b.ai (khả năng CORS, DNS, tường lửa hoặc mạng chặn).';
  }
  if (/BAI_HTTP_401/i.test(raw)) return 'API key B.AI không hợp lệ hoặc đã bị thu hồi (HTTP 401).';
  if (/BAI_HTTP_403/i.test(raw)) return 'B.AI từ chối quyền truy cập/model hoặc tài khoản chưa đủ điều kiện (HTTP 403).';
  if (/BAI_HTTP_429/i.test(raw)) return 'B.AI đang giới hạn tần suất (HTTP 429). Thử lại sau.';
  if (/BAI_MODEL_NOT_AVAILABLE/i.test(raw)) return 'Key kết nối được B.AI nhưng tài khoản hiện không thấy model deepseek-v4-flash trong /v1/models.';
  if (/BAI_EMPTY_LENGTH/i.test(raw)) return 'B.AI đã nhận request nhưng giới hạn max_tokens quá thấp nên chưa kịp tạo câu trả lời. Bản này sẽ tự thử lại với ngân sách token lớn hơn.';
  if (/BAI_EMPTY/i.test(raw)) return 'B.AI trả HTTP 200 nhưng phần nội dung trả lời đang rỗng. Bản này đã hỗ trợ cả JSON non-stream và SSE stream; hãy bấm Kiểm tra B.AI lại.';
  if (/AbortError|BAI_TIMEOUT/i.test(raw)) return 'B.AI phản hồi quá lâu và đã hết thời gian chờ.';
  return raw.replace(/^Error:\s*/i, '').slice(0, 500);
}

async function baiFetch(url, { method = 'GET', key, body = null, authMode = 'bearer', timeoutMs = 45000 } = {}) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    return await fetch(url, {
      method,
      headers: baiAuthHeaders(key, authMode, body !== null),
      ...(body !== null ? { body: JSON.stringify(body) } : {}),
      signal: ctl.signal,
      mode: 'cors',
      cache: 'no-store'
    });
  } catch (e) {
    if (e?.name === 'AbortError') throw new Error('BAI_TIMEOUT');
    const msg = String(e?.message || e);
    if (e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(msg)) {
      const x = new Error(`BAI_BROWSER_FETCH_FAILED — ${msg}`);
      x.cause = e;
      throw x;
    }
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

async function baiReadError(res) {
  let detail = '';
  try { detail = (await res.text()).replace(/\s+/g, ' ').trim().slice(0, 900); } catch (e) {}
  const err = new Error(`BAI_HTTP_${res.status}${detail ? ' — ' + detail : ''}`);
  err.status = res.status;
  return err;
}

async function baiListModels(apiKey = null) {
  const key = String(apiKey || BAI_API_KEY || '').trim();
  if (!key) throw new Error('NO_BAI_KEY');
  let lastErr = null;
  for (const authMode of ['bearer', 'x-api-key']) {
    try {
      const res = await baiFetch('https://api.b.ai/v1/models', { key, authMode, timeoutMs: 30000 });
      if (!res.ok) {
        lastErr = await baiReadError(res);
        if (res.status === 401 || res.status === 403) continue;
        throw lastErr;
      }
      const data = await res.json();
      const items = Array.isArray(data?.data) ? data.data : (Array.isArray(data) ? data : []);
      const ids = items.map(x => String(x?.id || x?.model || '')).filter(Boolean);
      return { ids, authMode };
    } catch (e) {
      lastErr = e;
      if (/BAI_BROWSER_FETCH_FAILED|BAI_TIMEOUT/.test(String(e?.message || e))) throw e;
    }
  }
  throw lastErr || new Error('BAI_MODELS_FAIL');
}

function baiTextPart(v) {
  if (typeof v === 'string') return v;
  if (Array.isArray(v)) return v.map(x => baiTextPart(x)).join('');
  if (!v || typeof v !== 'object') return '';
  if (typeof v.text === 'string') return v.text;
  if (typeof v.content === 'string') return v.content;
  if (Array.isArray(v.content)) return v.content.map(x => baiTextPart(x)).join('');
  return '';
}

function extractBaiPayloadText(data, { allowReasoning = false } = {}) {
  if (!data) return '';
  if (Array.isArray(data)) return data.map(x => extractBaiPayloadText(x, { allowReasoning })).join('');

  let out = '';
  const choices = Array.isArray(data?.choices) ? data.choices : [];
  for (const c of choices) {
    out += baiTextPart(c?.delta?.content);
    out += baiTextPart(c?.message?.content);
    if (!out && typeof c?.text === 'string') out += c.text;
  }

  if (!out) out += baiTextPart(data?.output_text);
  if (!out) out += baiTextPart(data?.response?.output_text);
  if (!out && Array.isArray(data?.output)) {
    for (const item of data.output) out += baiTextPart(item?.content || item?.text);
  }
  if (!out && Array.isArray(data?.content)) out += baiTextPart(data.content);

  /* Một số model suy luận có thể trả reasoning_content trước câu trả lời cuối.
     Chỉ dùng nó cho chẩn đoán text; KHÔNG dùng thay JSON báo cáo. */
  if (!out && allowReasoning) {
    for (const c of choices) {
      out += baiTextPart(c?.delta?.reasoning_content);
      out += baiTextPart(c?.message?.reasoning_content);
    }
    if (!out) out += baiTextPart(data?.reasoning_content);
  }
  return String(out || '').trim();
}

function parseBaiRawResponse(raw, { allowReasoning = false } = {}) {
  const s = String(raw || '').trim();
  if (!s) return { text: '', payload: null, isStream: false, finishReason: '' };

  /* SSE / stream OpenAI-compatible: data: {...}\n ... data: [DONE] */
  if (/^\s*(?:event:|data:)/m.test(s)) {
    const payloads = [];
    for (const line of s.split(/\r?\n/)) {
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const body = t.slice(5).trim();
      if (!body || body === '[DONE]') continue;
      try { payloads.push(JSON.parse(body)); } catch (e) {}
    }
    const text = extractBaiPayloadText(payloads, { allowReasoning });
    let finishReason = '';
    for (const p of payloads) {
      const f = p?.choices?.[0]?.finish_reason;
      if (f) finishReason = String(f);
    }
    return { text, payload: payloads, isStream: true, finishReason };
  }

  try {
    const payload = JSON.parse(s);
    const text = extractBaiPayloadText(payload, { allowReasoning });
    const finishReason = String(payload?.choices?.[0]?.finish_reason || '');
    return { text, payload, isStream: false, finishReason };
  } catch (e) {
    /* Nếu gateway trả text thuần thì vẫn nhận thay vì báo BAI_EMPTY. */
    return { text: s, payload: null, isStream: false, finishReason: '' };
  }
}

async function callBaiChatLean(modelId, apiKey, prompt, { json = true, temperature = 0.10, maxTokens = 4200, timeoutMs = 42000, reasoningEffort = null } = {}) {
  const key = String(apiKey || '').trim();
  if (!key) throw new Error('NO_BAI_KEY');
  const bodyBase = {
    model: modelId,
    messages: [{ role: 'user', content: String(prompt || '') }],
    stream: false,
    temperature,
    max_tokens: Math.max(Number(maxTokens) || 0, json ? 768 : 128),
    ...(reasoningEffort ? { reasoning_effort: reasoningEffort } : {})
  };
  const attempt = async (authMode, useFormat) => {
    const body = { ...bodyBase, ...(json && useFormat ? { response_format: { type: 'json_object' } } : {}) };
    const res = await baiFetch(BAI_ENDPOINT, { method:'POST', key, authMode, body, timeoutMs });
    if (!res.ok) throw await baiReadError(res);
    const raw = await res.text();
    const parsed = parseBaiRawResponse(raw, { allowReasoning:false });
    const answer = String(parsed.text || '').trim();
    if (!answer) throw new Error(parsed.finishReason === 'length' ? 'BAI_EMPTY_LENGTH' : 'BAI_EMPTY');
    try { window.__IDECO_HUYEN_PRIMARY_AI_LAST__ = { provider:'B.AI', model:modelId, at:Date.now(), key:maskBaiKey(key), authMode, stream:false, finishReason:parsed.finishReason || '' }; } catch (_) {}
    return answer;
  };
  try { return await attempt('bearer', !!json); }
  catch (e1) {
    const m1=String(e1?.message || e1 || '');
    if (/BAI_BROWSER_FETCH_FAILED|BAI_TIMEOUT/i.test(m1)) throw e1;
    if (json && /BAI_HTTP_(400|422)/i.test(m1)) {
      try { return await attempt('bearer', false); }
      catch (e2) {
        const m2=String(e2?.message || e2 || '');
        if (/BAI_BROWSER_FETCH_FAILED|BAI_TIMEOUT/i.test(m2)) throw e2;
        if (!/BAI_HTTP_(401|403)/i.test(m2)) throw e2;
      }
    } else if (!/BAI_HTTP_(401|403)/i.test(m1)) throw e1;
    try { return await attempt('x-api-key', !!json); }
    catch (e3) {
      const m3=String(e3?.message || e3 || '');
      if (json && /BAI_HTTP_(400|422)/i.test(m3)) return await attempt('x-api-key', false);
      throw e3;
    }
  }
}

  const deep = Number(maxTokens || 0) > 2600;

  const studioTimeout = Math.min(Number(fallbackTimeoutMs) || 55000, deep ? 45000 : 22000);
  const studio = () => callGemini(prompt,{ model:studioModel, json, temperature, maxTokens, timeoutMs:studioTimeout });
  const deepseek = () => callDeepSeekBai(prompt,{ json, temperature, maxTokens, timeoutMs:baiTimeout });
  const qwen = () => callQwenBai(prompt,{ json, temperature, maxTokens, timeoutMs:baiTimeout });
  const glm = () => callGlmBai(prompt,{ json, temperature, maxTokens, timeoutMs:baiTimeout });
  const run = async steps => { let last=null; for (const fn of steps) { try { return await fn(); } catch(e) { last=e; console.warn('[HUYEN V10.14] AI thường lỗi -> chuyển dự phòng:', e); } } throw last || new Error('HUYEN_ALL_STANDARD_AI_FAILED'); };
  if (provider === HUYEN_AI_PROVIDERS.GLM53_FLASH) return run(deep ? [glm,studio,qwen,deepseek] : [glm,studio,qwen]);
  if (provider === HUYEN_AI_PROVIDERS.QWEN38_FLASH) return run(deep ? [qwen,studio,glm,deepseek] : [qwen,studio,glm]);
  if (provider === HUYEN_AI_PROVIDERS.DEEPSEEK_V4_FLASH) return run(deep ? [deepseek,studio,glm,qwen] : [deepseek,studio,glm]);
  return run(deep ? [studio,qwen,glm,deepseek] : [studio,qwen,glm]);
}

/* V9.8 — chống đứt giữa chừng: chỉ tự nối lại 1 lần với lỗi tạm thời.
   Không retry lỗi key/quyền 401/403 để tránh tốn credit vô ích. */
function isHuyenTransientAiError(err) {
  const m = String(err?.message || err || '');
  if (/NO_KEY|401|403|permission|denied|invalid.?key/i.test(m)) return false;
  return /timeout|abort|network|failed to fetch|load failed|429|408|5\d\d|empty|bad_json|all_ai_failed|temporar|connection|fetch/i.test(m);
}
async function waitHuyenNetworkBriefly(maxMs = 12000) {
  if (typeof navigator === 'undefined' || navigator.onLine !== false) return;
  await new Promise(resolve => {
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      try { window.removeEventListener('online', finish); } catch (_) {}
      resolve();
    };
    try { window.addEventListener('online', finish, { once: true }); } catch (_) {}
    setTimeout(finish, maxMs);
  });
}
async function callHuyenPrimaryAIStable(prompt, opts = {}) {
  const callOpts = { ...opts };
  delete callOpts.retryCount;
  await waitHuyenNetworkBriefly(3500);
  /* Một request tuyến chính + fallback nội bộ là đủ; không lặp cả chuỗi lần hai. */
  return await callHuyenPrimaryAI(prompt, callOpts);
}

/* ---------------- HUYỀN TURBO — Gemini 3.8 Flash qua Kie.ai ----------------
   Gemini 3.8 Flash là tuyến Turbo chính; Gemini 3.7 Flash là dự phòng tương thích.
   Turbo chỉ chạy khi người dùng chủ động BẬT để BGĐ kiểm soát credit.
   Với Turbo, bật thinking HIGH để ưu tiên chẩn đoán tình huống Sales; KHÔNG đưa thought ra giao diện.
   Nếu Kie/Turbo lỗi mới quay về AI chính do BGĐ chọn và chuỗi dự phòng thường.
*/
const KIE_TURBO_API_KEY = "6a11cd4b360b77e7cd515b8296a00e6a";
const KIE_TURBO_MODELS = [
  { id: 'gemini-3-8-flash', endpoint: 'https://api.kie.ai/gemini/v1/models/gemini-3-8-flash:streamGenerateContent' },
  { id: 'gemini-3-7-flash', endpoint: 'https://api.kie.ai/gemini/v1/models/gemini-3-7-flash:streamGenerateContent' }
];

function extractKieGeminiText(payload) {
  const chunks = Array.isArray(payload) ? payload : [payload];
  let out = '';
  for (const chunk of chunks) {
    const candidates = chunk?.candidates || [];
    for (const c of candidates) {
      const parts = c?.content?.parts || [];
      for (const p of parts) {
        /* Kie/Gemini có thể trả phần suy nghĩ riêng. Không đưa thought ra giao diện. */
        if (p?.thought === true) continue;
        if (typeof p?.text === 'string') out += p.text;
      }
    }
  }
  return out.trim();
}

function parseKieTurboAnswer(rawText) {
  let answer = '';
  /* Kie có thể trả SSE (data: {...}) hoặc JSON/JSON-array tùy gateway. */
  if (/^\s*data:/m.test(rawText)) {
    const payloads = [];
    for (const line of rawText.split(/\r?\n/)) {
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const data = t.slice(5).trim();
      if (!data || data === '[DONE]') continue;
      try { payloads.push(JSON.parse(data)); } catch (e) {}
    }
    answer = extractKieGeminiText(payloads);
  } else {
    try { answer = extractKieGeminiText(JSON.parse(rawText)); }
    catch (e) { answer = String(rawText || '').trim(); }
  }
  return String(answer || '').trim();
}

async function callHuyenTurbo(prompt, { json = true, timeoutMs = 55000, thinkingLevel = 'high', maxOutputTokens = 4096 } = {}) {
  if (!KIE_TURBO_API_KEY) throw new Error('NO_TURBO_KEY');

  const deadline = Date.now() + Math.max(18000, Number(timeoutMs) || 55000);
  let lastErr = null;

  for (let modelIndex = 0; modelIndex < KIE_TURBO_MODELS.length; modelIndex++) {
    const spec = KIE_TURBO_MODELS[modelIndex];
    const remaining = deadline - Date.now();
    if (remaining < 7000) break;

    /* Lần đầu dùng thinking HIGH. Nếu gateway/model tạm không nhận thinkingConfig thì
       thử lại đúng model với cấu hình tối giản trước khi chuyển xuống Gemini 3.7. */
    for (const useThinking of [true, false]) {
      const body = {
        stream: true,
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        generationConfig: {
          ...(json ? { responseMimeType: 'application/json' } : {}),
          maxOutputTokens: Math.max(1024, Math.min(8192, Number(maxOutputTokens) || 4096)),
          ...(useThinking ? { thinkingConfig: { includeThoughts: false, thinkingLevel: thinkingLevel === 'low' ? 'low' : 'high' } } : {})
        }
      };

      const left = deadline - Date.now();
      if (left < 6500) break;
      const ctl = new AbortController();
      const perTryMs = Math.max(6500, Math.min(modelIndex === 0 ? 36000 : 24000, left));
      const timer = setTimeout(() => ctl.abort(), perTryMs);
      let res;
      try {
        res = await fetch(spec.endpoint, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${KIE_TURBO_API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body),
          signal: ctl.signal,
          cache: 'no-store'
        });
      } catch (e) {
        lastErr = e?.name === 'AbortError' ? new Error(`TURBO_TIMEOUT [${spec.id}]`) : e;
        break; // lỗi mạng/timeout: chuyển model dự phòng, không gọi lặp cấu hình
      } finally { clearTimeout(timer); }

      if (!res.ok) {
        let detail = '';
        try { detail = (await res.text()).replace(/\s+/g,' ').trim().slice(0, 700); } catch (e) {}
        const err = new Error(`TURBO_HTTP_${res.status} [${spec.id}]${detail ? ' — ' + detail : ''}`);
        err.status = res.status; err.model = spec.id;
        lastErr = err;
        /* 400/422 có thể do thinkingConfig/responseMimeType: thử cấu hình tối giản một lần. */
        if (useThinking && (res.status === 400 || res.status === 422)) continue;
        break;
      }

      const rawText = await res.text();
      const answer = parseKieTurboAnswer(rawText);
      if (!answer) {
        lastErr = new Error(`TURBO_EMPTY [${spec.id}]`);
        break;
      }

      window.__IDECO_HUYEN_TURBO_LAST__ = {
        model: spec.id, provider: 'Kie.ai', thinking: useThinking ? (thinkingLevel === 'low' ? 'low' : 'high') : 'gateway-default', at: Date.now()
      };
      if (modelIndex > 0) {
        try { window.__IDECO_HUYEN_TURBO_MODEL_FALLBACK__ = { from:'gemini-3-8-flash', to:spec.id, at:Date.now() }; } catch (_) {}
      }
      return answer;
    }
  }

  throw lastErr || new Error('TURBO_ALL_MODELS_FAILED');
}

function extractGeminiInteractionText(data) {
  if (!data || typeof data !== 'object') return '';
  if (typeof data.output_text === 'string' && data.output_text.trim()) return data.output_text.trim();
  const steps = Array.isArray(data.steps) ? data.steps : [];
  let lastModelText = '';
  for (const step of steps) {
    if (!step || typeof step !== 'object') continue;
    if (step.type !== 'model_output' && !Array.isArray(step.content)) continue;
    const parts = Array.isArray(step.content) ? step.content : [];
    let chunk = '';
    for (const p of parts) {
      if (!p || typeof p !== 'object') continue;
      if ((p.type === 'text' || typeof p.text === 'string') && typeof p.text === 'string') chunk += p.text;
    }
    if (chunk.trim()) lastModelText = chunk.trim();
  }
  return lastModelText;
}

function geminiThinkingLevelFor(model, maxTokens) {
  const m = String(model || '').toLowerCase();
  const deep = Number(maxTokens || 0) > 3200;
  /* Gemini 3.7/3.6/3.5 va 2.5 deu ho tro thinking level; low uu tien do tre, medium cho phan tich sau. */
  if (/gemini-(?:3\.7|3\.6|3\.5|2\.5)-(?:flash|flash-lite|pro)/.test(m)) return deep ? 'medium' : 'low';
  return null;
}

async function callGemini(prompt, { model = null, json = true, tools = null, temperature, maxTokens = 3200, timeoutMs = 30000 } = {}) {
  const entries = geminiKeyEntries();
  if (!entries.length) throw new Error('NO_KEY');
  const modelQueue = geminiStudioModelCandidates(model || GEMINI_STUDIO_MODEL);

  let globalLastErr = null;
  for (const chosenModel of modelQueue) {
    const start = Math.min(GEMINI_ACTIVE_KEY_INDEX, Math.max(0, entries.length - 1));
    const ordered = entries.slice(start).concat(entries.slice(0, start));
    const ready = ordered.filter(x => !isKeyCooling(x.key));
    const queue = ready.length ? ready : ordered;
    let modelUnavailable = false;
    let lastErr = null;

    for (const entry of queue) {
      try {
        const gen = {
          max_output_tokens: Math.max(256, Math.min(8192, Number(maxTokens) || 3200))
        };
        const thinkingLevel = geminiThinkingLevelFor(chosenModel, maxTokens);
        if (thinkingLevel) gen.thinking_level = thinkingLevel;

        const body = {
          model: chosenModel,
          input: String(prompt || ''),
          store: false,
          generation_config: gen
        };
        if (json && !tools) body.response_format = { type: 'text', mime_type: 'application/json' };
        if (Array.isArray(tools) && tools.length) {
          body.tools = tools.map(t => {
            if (t && t.google_search !== undefined) return { type: 'google_search' };
            if (t && t.type) return t;
            return t;
          }).filter(Boolean);
        }

        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), Math.max(10000, Number(timeoutMs) || 30000));
        let res;
        try {
          res = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': entry.key },
            body: JSON.stringify(body), signal: ctl.signal, cache: 'no-store'
          });
        } finally { clearTimeout(timer); }

        if (!res.ok) {
          let detail = '';
          try { detail = (await res.text()).replace(/\s+/g, ' ').trim().slice(0, 1200); } catch (e) {}
          const err = new Error(`GEMINI_HTTP_${res.status} [${chosenModel}]${detail ? ' — ' + detail : ''}`);
          err.status = res.status; err.keyLabel = entry.label; err.model = chosenModel;
          lastErr = err; globalLastErr = err;

          /* 404 do MODEL khong con ton tai/khong con cap cho user moi -> doi model ngay, khong dot 3 key. */
          if (isGeminiModelUnavailable404(res.status, detail)) {
            modelUnavailable = true;
            try { console.warn('[HUYEN GEMINI MODEL FALLBACK]', chosenModel, 'khong con kha dung -> doi model ke tiep'); } catch (_) {}
            break;
          }

          if (res.status === 429) GEMINI_KEY_COOLDOWN.set(entry.key, Date.now() + 120000);
          else if (res.status === 401 || res.status === 403) GEMINI_KEY_COOLDOWN.set(entry.key, Date.now() + 600000);
          else if (res.status >= 500) GEMINI_KEY_COOLDOWN.set(entry.key, Date.now() + 30000);
          try { console.warn('[HUYEN GEMINI INTERACTIONS]', entry.label, chosenModel, `HTTP ${res.status}`, detail.slice(0, 350)); } catch (_) {}
          continue;
        }

        const data = await res.json();
        const text = extractGeminiInteractionText(data);
        if (text) {
          const realIndex = entries.findIndex(x => x.key === entry.key);
          if (realIndex >= 0) GEMINI_ACTIVE_KEY_INDEX = realIndex;
          GEMINI_KEY_COOLDOWN.delete(entry.key);

          /* Neu model du phong da chay thanh cong, tu cap nhat model hien tai + Firebase de lan sau vao thang model tot. */
          if (chosenModel !== GEMINI_STUDIO_MODEL) {
            setGeminiStudioModel(chosenModel);
            try {
              dbGet('settings/huyenAiConfig').then(cfg => dbSet('settings/huyenAiConfig', {
                ...(cfg || {}), geminiStudioModel: chosenModel, studioModel: chosenModel, updatedAt: Date.now()
              })).catch(() => {});
            } catch (_) {}
          }

          window.__IDECO_GEMINI_LAST_KEY__ = {
            label: entry.label, masked: maskGeminiKey(entry.key), model: chosenModel,
            api: 'interactions', status: data?.status || 'completed', at: Date.now()
          };
          return text;
        }

        const status = String(data?.status || '');
        lastErr = Object.assign(new Error(`GEMINI_EMPTY [${chosenModel}] status=${status || 'unknown'}`), {
          keyLabel: entry.label, model: chosenModel, interactionStatus: status
        });
        globalLastErr = lastErr;
      } catch (e) {
        lastErr = e; globalLastErr = e;
        if (e && e.name === 'AbortError') {
          GEMINI_KEY_COOLDOWN.set(entry.key, Date.now() + 30000);
          lastErr = globalLastErr = new Error(`GEMINI_TIMEOUT [${chosenModel}]`);
        }
      }
    }

    if (modelUnavailable) continue;
    /* Neu model hop le nhung ca 3 key deu loi/quota/auth thi khong doi model vo ich. */
    if (lastErr && !/GEMINI_HTTP_404/.test(String(lastErr.message || ''))) break;
  }

  try { window.__IDECO_HUYEN_LAST_AI_ERROR__ = { at: Date.now(), error: String(globalLastErr?.message || globalLastErr || ''), model: GEMINI_STUDIO_MODEL }; } catch (_) {}
  throw globalLastErr || new Error(`GEMINI_ALL_KEYS_FAILED [${GEMINI_STUDIO_MODEL}]`);
}

function _huyenNormalizeJsonText(txt) {
  return String(txt || '')
    .replace(/```json/gi, '').replace(/```/g, '')
    .replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, ' ')
    .trim();
}

/* Cố gắng đóng chuỗi / ngoặc khi model bị cắt giữa chừng vì giới hạn token hoặc stream. */
function _huyenBalanceJsonCandidate(input) {
  let s = _huyenNormalizeJsonText(input);
  const a = s.search(/[\{\[]/);
  if (a < 0) return s;
  s = s.slice(a);
  const stack = [];
  let inString = false, escaped = false, out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    out += ch;
    if (inString) {
      if (escaped) { escaped = false; continue; }
      if (ch === '\\') { escaped = true; continue; }
      if (ch === '"') inString = false;
      continue;
    }
    if (ch === '"') { inString = true; continue; }
    if (ch === '{' || ch === '[') stack.push(ch);
    else if (ch === '}' || ch === ']') {
      const want = ch === '}' ? '{' : '[';
      if (stack.length && stack[stack.length - 1] === want) stack.pop();
    }
  }
  if (inString) out += '"';
  out = out.trim();
  if (/[:,]\s*$/.test(out)) {
    if (/[:,]\s*$/.test(out) && /:\s*$/.test(out)) out += 'null';
    else out = out.replace(/,\s*$/, '');
  }
  while (stack.length) out += (stack.pop() === '{' ? '}' : ']');
  return out.replace(/,\s*([}\]])/g, '$1');
}

function safeJson(txt, fallback) {
  if (!txt) return fallback;
  const t = _huyenNormalizeJsonText(txt);
  const tries = [];
  const push = x => { x = String(x || '').trim(); if (x && !tries.includes(x)) tries.push(x); };
  push(t);
  const firstOpen = t.search(/[\{\[]/);
  if (firstOpen >= 0) push(t.slice(firstOpen));
  const firstObj = t.indexOf('{'), lastObj = t.lastIndexOf('}');
  if (firstObj >= 0 && lastObj > firstObj) push(t.slice(firstObj, lastObj + 1));
  const firstArr = t.indexOf('['), lastArr = t.lastIndexOf(']');
  if (firstArr >= 0 && lastArr > firstArr) push(t.slice(firstArr, lastArr + 1));
  [...tries].forEach(x => push(_huyenBalanceJsonCandidate(x)));

  for (let x of tries) {
    for (const candidate of [x, x.replace(/,\s*([}\]])/g, '$1')]) {
      try {
        const parsed = JSON.parse(candidate);
        if (typeof parsed === 'string' && /^[\s\n]*[\{\[]/.test(parsed)) {
          const nested = safeJson(parsed, null);
          if (nested !== null) return nested;
        }
        return parsed;
      } catch (e) {}
    }
  }
  return fallback;
}

function _huyenLooseJsonString(raw, name) {
  const s = _huyenNormalizeJsonText(raw);
  const key = `"${name}"`;
  let p = s.indexOf(key);
  if (p < 0) return '';
  p = s.indexOf(':', p + key.length);
  if (p < 0) return '';
  p++;
  while (p < s.length && /\s/.test(s[p])) p++;
  if (s[p] !== '"') {
    const tail = s.slice(p).split(/[,}\]]/)[0].trim();
    return tail.replace(/^"|"$/g, '');
  }
  p++;
  let buf = '', esc = false;
  for (; p < s.length; p++) {
    const ch = s[p];
    if (esc) { buf += '\\' + ch; esc = false; continue; }
    if (ch === '\\') { esc = true; continue; }
    if (ch === '"') break;
    buf += ch;
  }
  try { return JSON.parse('"' + buf.replace(/"/g, '\\"') + '"'); }
  catch (e) {
    return buf.replace(/\\n/g, '\n').replace(/\\r/g, '\r').replace(/\\t/g, '\t').replace(/\\"/g, '"').replace(/\\\\/g, '\\').trim();
  }
}

function _huyenLooksLikeRawJson(v) {
  const s = String(v || '').trim();
  return /^[\{\[]/.test(s) && /"(?:situationSummary|stage|mainBarrier|recommendedActions|finalAdvice)"\s*:/.test(s);
}

function _huyenLooseAdvisorFromRaw(raw) {
  const fields = ['situationSummary','stage','priority','mainBarrier','salesDiagnosis','customerMindset','timelineAssessment','managementSupport','nextFollowUp','relationshipDecision','finalAdvice'];
  const out = {};
  for (const k of fields) {
    const v = _huyenLooseJsonString(raw, k);
    if (v) out[k] = v;
  }
  if (!out.situationSummary && !out.finalAdvice && !out.mainBarrier) return null;
  out.stage = out.stage || 'Chưa xác định';
  out.priority = out.priority || 'Trung bình';
  out.recommendedActions = [];
  out.questionsToAsk = [];
  out.missingInfo = [];
  out.talkToTriet = { needed:false, reason:'', ask:'' };
  if (!out.finalAdvice) out.finalAdvice = out.salesDiagnosis || out.mainBarrier || out.situationSummary || '';
  return out;
}

function _huyenCleanAdvisorText(v, max = 12000) {
  if (v === null || v === undefined) return '';
  if (typeof v !== 'string') return '';
  let s = v.replace(/```json|```/gi, '').trim();
  if (_huyenLooksLikeRawJson(s)) return '';
  return s.length > max ? s.slice(0, max) : s;
}

function normalizeAdvisorResultShape(value, raw = '') {
  let r = value;
  if (typeof r === 'string') r = safeJson(r, null) || _huyenLooseAdvisorFromRaw(r);
  if (!r || typeof r !== 'object' || Array.isArray(r)) r = _huyenLooseAdvisorFromRaw(raw);
  if (!r || typeof r !== 'object') return null;

  /* Một số gateway có thể bọc cả JSON vào situationSummary. Nếu gặp thì bóc lớp đó ra. */
  if (_huyenLooksLikeRawJson(r.situationSummary)) {
    const nested = safeJson(r.situationSummary, null);
    if (nested && typeof nested === 'object' && !Array.isArray(nested)) r = nested;
  }

  const loose = _huyenLooseAdvisorFromRaw(raw) || {};
  const out = { ...r };
  const textFields = ['situationSummary','stage','priority','mainBarrier','salesDiagnosis','customerMindset','timelineAssessment','managementSupport','nextFollowUp','relationshipDecision','finalAdvice'];
  for (const k of textFields) {
    let v = _huyenCleanAdvisorText(out[k]);
    if (!v && loose[k]) v = _huyenCleanAdvisorText(loose[k]);
    out[k] = v;
  }

  out.stage = out.stage || 'Chưa xác định';
  out.priority = out.priority || 'Trung bình';
  for (const k of ['scenarioHypotheses','opportunities','risks','objectionHandling','negotiationPlan','questionsToAsk','whatNotToDo','recommendedActions','missingInfo','knowledgeUsed']) {
    if (!Array.isArray(out[k])) out[k] = [];
  }
  for (const k of ['dealHealth','nextConversationPlan','closingPlan','talkToTriet']) {
    if (!out[k] || typeof out[k] !== 'object' || Array.isArray(out[k])) out[k] = k === 'talkToTriet' ? {needed:false,reason:'',ask:''} : null;
  }

  /* Tuyệt đối không cho JSON thô lọt ra giao diện. */
  if (_huyenLooksLikeRawJson(out.situationSummary)) out.situationSummary = loose.situationSummary || '';
  if (_huyenLooksLikeRawJson(out.mainBarrier)) out.mainBarrier = loose.mainBarrier || '';
  if (_huyenLooksLikeRawJson(out.finalAdvice)) out.finalAdvice = loose.finalAdvice || '';
  if (!out.situationSummary) out.situationSummary = out.salesDiagnosis || out.mainBarrier || 'Huyền đã nhận được dữ liệu và đang ưu tiên các điểm cần xử lý trước.';
  if (!out.finalAdvice) {
    const firstAction = out.recommendedActions[0] && (out.recommendedActions[0].action || out.recommendedActions[0].suggestedScript);
    out.finalAdvice = firstAction || out.salesDiagnosis || out.mainBarrier || out.situationSummary;
  }
  return out;
}

function advisorResultHasUsefulContent(r) {
  if (!r || typeof r !== 'object') return false;
  const summary = String(r.situationSummary || '').trim();
  if (!summary || _huyenLooksLikeRawJson(summary)) return false;
  return !!(String(r.finalAdvice || r.mainBarrier || r.salesDiagnosis || '').trim() || (Array.isArray(r.recommendedActions) && r.recommendedActions.length));
}

  try {

    return { status: 'success', text: r.refinedText || text, message: r.advice || 'Đã chuẩn hóa văn bản.' };

      return { status: 'warning', text, message: 'Chưa có API key Gemini. Vào Hệ thống → Cài đặt AI để nhập key dự phòng.' };
    }
    return { status: 'warning', text, message: 'Lỗi kết nối AI, vui lòng thử lại.' };
  }
}

function normalizeKnowledgeEntries(d) {
  if (!d) return [];
  const arr = Array.isArray(d) ? d : Object.values(d);
  return arr.filter(x => x && x.title && x.content)
    .sort((a,b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
}

/* Cache Kho kiến thức 5 phút: mở nhiều khách liên tiếp không phải đọc Firebase lại mỗi lần. */
const HUYEN_KB_CACHE = { at: 0, data: null };
async function getHuyenKnowledgeCached() {
  const now = Date.now();
  if (HUYEN_KB_CACHE.data !== null && (now - HUYEN_KB_CACHE.at) < 300000) return HUYEN_KB_CACHE.data;

async function analyzeLatestCustomerStrategy(customer, { turbo = false, mode = 'fast' } = {}) {
  if (!customer) throw new Error('NO_CUSTOMER');
  const analysisMode = mode === 'deep' ? 'deep' : 'fast';
  const isDeepMode = analysisMode === 'deep';
  const modeCfg = isDeepMode ? {
    appointments: 20, reportChars: 13000, feedbackChars: 6500,
    kbRelevant: 6, kbNewest: 2, kbMax: 8, kbItemChars: 5000, kbTotalChars: 22000,
    maxTokens: 6500, repairTokens: 2200, timeoutMs: 95000, fallbackTimeoutMs: 85000, retryCount: 2
  } : {
    appointments: 5, reportChars: 3600, feedbackChars: 1800,
    kbRelevant: 1, kbNewest: 1, kbMax: 2, kbItemChars: 1500, kbTotalChars: 2800,
    maxTokens: 3000, repairTokens: 1800, timeoutMs: 20000, fallbackTimeoutMs: 30000, retryCount: 1
  };

  const memoryFingerprint = huyenAnalysisFingerprint(customer, `${analysisMode}:${turbo ? 'turbo' : 'standard'}`);
  const memorySlot = `${customer.id || customer.name || 'customer'}::${analysisMode}::${turbo ? 'turbo' : 'standard'}`;
  const memoryCached = HUYEN_ANALYSIS_CACHE.get(memorySlot);
  if (memoryCached && memoryCached.fingerprint === memoryFingerprint && memoryCached.result) {
    return { ...memoryCached.result, _huyenMeta: { ...(memoryCached.result._huyenMeta || {}), memoryHit: true, memorySource: 'session' } };
  }

  /*
     HUYỀN SMART SALES ADVISOR V5 — 2 CHẾ ĐỘ NHANH / SÂU + BÁM DỮ LIỆU
     - Không tăng thêm một lượt gọi AI: vẫn chỉ 1 lượt phân tích chính (Turbo hoặc AI thường).
     - Tính trước mốc thời gian bằng JavaScript để AI không phải tự đoán ngày/thời lượng.
     - Nhận diện tín hiệu từ chối / trì hoãn / yêu cầu thương lượng trước khi gửi AI.
     - Xếp hạng Kho kiến thức theo mức liên quan để giảm nhiễu và tiết kiệm token.
     - Buộc AI đưa ra chiến lược chốt hợp tác, xử lý phản đối và giới hạn thẩm quyền rõ ràng.
  */
  const clipText = (v, max) => {
    const t = String(v || '').trim();
    return t.length > max ? t.slice(0, max) + '\n[Đã lược bớt phần quá dài, ưu tiên dữ liệu mới nhất]' : t;
  };

  const foldVN = (v) => String(v || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .toLowerCase();

  const today = new Date();
  const parseLocalDate = (v, time = '12:00') => {
    if (!v) return null;
    const d = new Date(`${v}T${time || '12:00'}:00`);
    return Number.isNaN(d.getTime()) ? null : d;
  };
  const dayDiff = (later, earlier) => {
    if (!later || !earlier) return null;
    return Math.max(0, Math.floor((later.getTime() - earlier.getTime()) / 86400000));
  };
  const signedDayDiff = (later, earlier) => {
    if (!later || !earlier) return null;
    return Math.round((later.getTime() - earlier.getTime()) / 86400000);
  };

  /* ---------- 1) DỰNG TIMELINE CHÍNH XÁC TỪ DỮ LIỆU CÓ THẬT ---------- */
  const appts = (Array.isArray(customer.appointments) ? customer.appointments : []).slice(-modeCfg.appointments).map(a => ({
    date: a?.date || '',
    time: a?.time || '',
    content: clipText(a?.content, 450),
    isCompleted: !!a?.isCompleted
  }));

  let savedAt = '';
  let validUpdatedObj = null;
  try {
    validUpdatedObj = customer.updatedAt ? new Date(customer.updatedAt) : null;
    if (validUpdatedObj && !Number.isNaN(validUpdatedObj.getTime())) savedAt = validUpdatedObj.toISOString();
    else validUpdatedObj = null;
  } catch (e) { validUpdatedObj = null; }

  const startDateObj = parseLocalDate(customer.transactionDate);
  const appointmentTimeline = appts
    .map(a => ({ ...a, _d: parseLocalDate(a.date, a.time || '12:00') }))
    .filter(a => a._d)
    .sort((a,b) => a._d - b._d);

  const completedAppointments = appointmentTimeline.filter(a => a.isCompleted && a._d <= today);
  const openAppointments = appointmentTimeline.filter(a => !a.isCompleted);
  const overdueAppointments = openAppointments.filter(a => a._d < today);
  const upcomingAppointments = openAppointments.filter(a => a._d >= today);

  const latestAppointment = appointmentTimeline.length ? appointmentTimeline[appointmentTimeline.length - 1] : null;
  const latestCompletedAppointment = completedAppointments.length ? completedAppointments[completedAppointments.length - 1] : null;
  const latestOverdueAppointment = overdueAppointments.length ? overdueAppointments[overdueAppointments.length - 1] : null;
  const nextOpenAppointment = upcomingAppointments.length ? upcomingAppointments[0] : null;

  /* Điểm hoạt động của hồ sơ: chỉ lấy dữ liệu đã xảy ra, không lấy lịch hẹn tương lai làm “lần chạm gần nhất”. */
  const pastRecordPoints = [startDateObj, validUpdatedObj, ...completedAppointments.map(a => a._d)]
    .filter(d => d && d <= today)
    .sort((a,b) => a - b);
  const latestRecordActivity = pastRecordPoints.length ? pastRecordPoints[pastRecordPoints.length - 1] : null;

  const gaps = [];
  for (let i = 1; i < pastRecordPoints.length; i++) {
    const g = dayDiff(pastRecordPoints[i], pastRecordPoints[i-1]);
    if (g !== null) gaps.push(g);
  }
  const maxGapDays = gaps.length ? Math.max(...gaps) : null;
  const avgGapDays = gaps.length ? Math.round((gaps.reduce((s,x)=>s+x,0) / gaps.length) * 10) / 10 : null;

  const daysFromStart = startDateObj ? dayDiff(today, startDateObj) : null;
  const daysSinceRecordActivity = latestRecordActivity ? dayDiff(today, latestRecordActivity) : null;
  const overdueDays = latestOverdueAppointment ? dayDiff(today, latestOverdueAppointment._d) : null;
  const daysUntilNextAppointment = nextOpenAppointment ? Math.max(0, signedDayDiff(nextOpenAppointment._d, today)) : null;

  const timelineSummary = {

  const statusText = String(customer.status || '').trim();

  const foldedCommercial = foldVN(fullCommercialText);

  const addRequest = (label, re) => { if (re.test(foldedCommercial)) commercialRequests.push(label); };
  addRequest('Giá / chiết khấu', /\bgia\b|chiet khau|giam gia|gia cao|gia dat/);
  addRequest('Công nợ / thời hạn thanh toán', /cong no|thanh toan cham|no hang|han thanh toan|goi no/);

  /* ---------- 3) CHỌN KHO KIẾN THỨC LIÊN QUAN NHẤT, TRÁNH NHỒI TOÀN BỘ ---------- */
  const kbRaw = await getHuyenKnowledgeCached();

  const contextTerms = Array.from(new Set(
    foldVN([customer.name, customer.type, customer.report, customer.customerFeedback, commercialRequests.join(' ')].join(' '))
      .split(/[^a-z0-9]+/)
      .filter(x => x.length >= 3 && !stopWords.has(x))

  const scoredKb = kb.map((x, index) => {
    const title = foldVN(x.title);

    for (const term of contextTerms) {
      if (title.includes(term)) score += 5;

    return { ...x, _score: score, _order: index };

  const selectedKb = [];

  kb.slice(0, modeCfg.kbNewest).forEach(pushKb); // giữ mục mới nhất để không bỏ sót hướng dẫn vừa cập nhật

  }).join('\n');
  if (knowledgeText.length > modeCfg.kbTotalChars) knowledgeText = knowledgeText.slice(0, modeCfg.kbTotalChars) + '\n[Đã lược bớt Kho kiến thức theo chế độ phân tích đã chọn]';

  /* ---------- 4) PROMPT CỐ VẤN: EVIDENCE -> TIMELINE -> PHẢN ĐỐI -> CHỐT ----------
     V4 FAST: giảm mạnh context/token, ưu tiên hành động chốt quan trọng; chỉ giữ Kho kiến thức liên quan nhất + cache 5 phút.
  */

MỤC TIÊU DUY NHẤT:

CHẾ ĐỘ PHÂN TÍCH ĐƯỢC NHÂN VIÊN CHỌN: ${isDeepMode ? 'PHÂN TÍCH SÂU — chấp nhận chờ lâu hơn để đọc nhiều ngữ cảnh, giải thích kỹ nguyên nhân, phản đối, kịch bản và phương án chốt.' : 'PHÂN TÍCH NHANH — ưu tiên trả kết quả sớm, tập trung 3-4 điểm quyết định nhất và hành động có thể làm ngay; tránh diễn giải dài hoặc lặp ý.'}
${isDeepMode ? '- Với chế độ SÂU: khai thác đầy đủ các bằng chứng quan trọng, 5-7 hướng xử lý khi có đủ căn cứ, kịch bản trao đổi chi tiết hơn và phương án B/C nếu cần.' : '- Với chế độ NHANH: mỗi mục viết gọn nhưng cụ thể; ưu tiên rào cản chính, 3 hành động đầu tiên, câu hỏi khóa và cam kết nhỏ nhất để chốt.'}

QUY TRÌNH PHÂN TÍCH BẮT BUỘC:
1. TIMELINE: Xác định tuổi hồ sơ, lần cập nhật gần nhất, lịch hẹn đã hoàn thành, lịch hẹn quá hạn, lịch hẹn sắp tới, số ngày trễ và nhịp theo dõi. Tuyệt đối không coi một lịch hẹn tương lai là "lần tương tác đã xảy ra".
2. NHỊP CHĂM SÓC: Nếu đã theo nhiều vòng mà không tiến triển, không được lặp lại cùng một cách tiếp cận; phải đề xuất đổi góc tiếp cận, đổi giá trị trao đổi hoặc xin quyết định dừng/tái kích hoạt.
3. GIAI ĐOẠN SALES: Chọn đúng giai đoạn: mới tiếp cận / khám phá nhu cầu / quan tâm / cân nhắc / đàm phán / trì hoãn / từ chối / chờ chính sách / chờ người quyết định / thử hàng / sắp chốt / đã hợp tác / cần tái kích hoạt.
4. RÀO CẢN GỐC: Tìm rào cản thật sự, không chỉ lặp lại câu khách nói. Ví dụ "giá cao" có thể cần làm rõ khách đang so với sản phẩm nào, quy cách nào, giá mua vào hay giá bán ra; nhưng chỉ được coi là giả thuyết cho tới khi có bằng chứng.
5. PHẢN ĐỐI/TỪ CHỐI: Với từng phản đối phải phân loại một trong: "Từ chối thật", "Trì hoãn lịch sự", "Yêu cầu thương lượng", "Thiếu thông tin", "Chưa gặp người quyết định", "Đang ưu tiên nhà cung cấp khác", "Khác". Sau đó nêu câu hỏi làm rõ + cách xử lý + dấu hiệu để biết phản đối đã được giải quyết.
6. YÊU CẦU/ĐIỀU KIỆN KHÁCH HÀNG: Nếu khách yêu cầu giá, CK, công nợ, đổi trả, bán thử, chương trình, hóa đơn/chứng từ, độc quyền hoặc điều kiện đặc biệt thì phải tách từng yêu cầu. Phân loại: "Có thể xử lý theo dữ liệu đã có" / "Cần Chú Triết-BGĐ duyệt" / "Chưa đủ dữ liệu". Không hứa thay BGĐ.
7. KHO KIẾN THỨC: Chỉ áp dụng kiến thức thực sự liên quan. Nếu nhiều mục mâu thuẫn, ưu tiên mục cập nhật mới hơn trong cùng tình huống; nếu vẫn chưa chắc, nêu rõ cần BGĐ xác nhận. Liệt kê đúng tiêu đề đã dùng.
8. CHIẾN LƯỢC CHỐT: Không mặc định phải chốt đơn ngay. Chọn "cam kết nhỏ nhất tiếp theo" có xác suất cao nhất: đồng ý nhận báo giá, chọn 1-2 sản phẩm thử, xác nhận chính sách cần duyệt, hẹn người quyết định, chốt thời gian phản hồi, hoặc đặt đơn thử — nhưng chỉ đề xuất các hình thức phù hợp dữ liệu/chính sách đã biết.
9. ĐÒN BẨY GIÁ TRỊ: Khi phù hợp, có thể nhấn vào giá trị như hàng chính hãng, hóa đơn/chứng từ đầy đủ, hỗ trợ bán thử/đổi trả/công nợ/chương trình CHỈ KHI các quyền lợi này có trong hồ sơ hoặc Kho kiến thức. Nếu chưa có căn cứ, ghi "cần xác nhận chính sách".
10. THỜI ĐIỂM LIÊN HỆ: Nếu có lịch hẹn tương lai đã chốt, ưu tiên tôn trọng lịch đó trừ khi có lý do cấp bách. Nếu lịch đã quá hạn, đề xuất liên hệ bù và cách mở lời. Nếu im lặng quá lâu, cần chiến lược tái kích hoạt khác với nhắc lại thông thường.
11. BGĐ/CHÚ TRIẾT: Chỉ đề nghị "Trao đổi với Chú Triết ngay" khi có ít nhất một lý do cụ thể: chính sách ngoài thẩm quyền, khách chuỗi/khách lớn, yêu cầu thương mại đặc biệt, nguy cơ mất khách đáng kể, xung đột chính sách, hoặc nhiều vòng không tiến triển cần quyết định chiến lược.
12. CÂU NÓI GỢI Ý: Phải tự nhiên, tôn trọng khách, không gây áp lực quá mức, không nói quá công dụng/sản phẩm, không hứa điều chưa được duyệt.
13. KẾT LUẬN: Phải trả lời rõ "Bây giờ nên làm gì trước tiên?", "Mục tiêu của lần liên hệ tiếp theo là gì?", "Điều gì cần hỏi thêm?", và "Khi nào cần dừng/đổi chiến lược?".
14. ĐỘ SÂU NHƯNG NHANH: Không trả lời chung chung, nhưng tránh diễn giải lặp. Tập trung 4-5 hành động có tác động lớn nhất; mỗi hành động phải có lý do + mục tiêu + câu gợi ý nếu phù hợp.
15. TÂM LÝ KHÁCH HÀNG: Từ lời khách và diễn biến giao dịch, đánh giá thận trọng khách đang quan tâm thật, trì hoãn, so sánh, phòng thủ, thiếu niềm tin, thiếu thẩm quyền hay chưa thấy đủ giá trị. Nếu chỉ là suy luận phải ghi rõ là suy luận, không biến suy luận thành sự thật.
16. CHỐT SALES THỰC TẾ: Không chỉ nói “theo dõi thêm”. Phải xác định một CAM KẾT NHỎ NHẤT cụ thể có thể xin ở lần tiếp theo, câu hỏi khóa để tiến tới quyết định, dấu hiệu mua hàng cần quan sát và phương án B nếu khách chưa đồng ý.
17. PHONG CÁCH: Viết tiếng Việt tự nhiên, sâu sắc, giống một quản lý kinh doanh giàu kinh nghiệm đang góp ý trực tiếp cho nhân viên. Chi tiết nhưng không lặp ý, không lý thuyết suông, không dùng những câu sáo rỗng nếu hồ sơ không hỗ trợ.
18. GIẢ THUYẾT TÌNH HUỐNG SALES: Trước khi khuyên, phải cân nhắc 2-3 khả năng hợp lý giải thích hành vi hiện tại của khách (ví dụ: quan tâm thật nhưng chưa đủ lý do mua; trì hoãn lịch sự; đang so sánh nhà cung cấp; chưa gặp đúng người quyết định; cần điều kiện thương mại; chưa tin vào giá trị). Mỗi giả thuyết phải có bằng chứng ủng hộ, bằng chứng còn thiếu/mâu thuẫn, mức tin cậy Cao/Trung bình/Thấp và một câu hỏi kiểm chứng. Đây là SUY LUẬN, tuyệt đối không viết thành sự thật đã xác nhận.
19. PHẢN ỨNG THEO KỊCH BẢN: Với giả thuyết có khả năng cao nhất, đề xuất cách phản ứng phù hợp. Nếu câu trả lời của khách ở lần tới phủ định giả thuyết đó, phải có hướng chuyển sang giả thuyết kế tiếp thay vì tiếp tục ép cùng một kịch bản.
20. ĐIỂM CƠ HỘI: dealHealth.score chỉ là chỉ báo quản trị 0-100, KHÔNG phải xác suất chắc chắn. Chấm dựa trên bằng chứng: tín hiệu mua, mức rõ của nhu cầu, quyền quyết định, rào cản thương mại, độ mới của tương tác, lịch hẹn và tiến triển qua các lần chạm. Nếu dữ liệu yếu thì score phải thận trọng và basis phải nói rõ giới hạn.

/* Doc noi dung PDF/Word de dua vao Kho kien thuc; chi luu TEXT, khong luu file nhi phan */
async function extractKnowledgeFileText(file) {
  if (!file) throw new Error('NO_FILE');
  const name = String(file.name || '').toLowerCase();
  const buf = await file.arrayBuffer();

  if (name.endsWith('.pdf') || file.type === 'application/pdf') {
    if (!window.pdfjsLib) throw new Error('PDF_LIB_MISSING');
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      pages.push(tc.items.map(it => it.str || '').join(' ').replace(/\s+/g, ' ').trim());
    }
    return pages.filter(Boolean).join('\n\n');
  }

  if (name.endsWith('.docx')) {
    if (!window.mammoth) throw new Error('DOCX_LIB_MISSING');
    const r = await window.mammoth.extractRawText({ arrayBuffer: buf });
    return String(r.value || '').trim();
  }

  if (name.endsWith('.txt') || (file.type || '').startsWith('text/')) {
    return new TextDecoder('utf-8').decode(buf).trim();
  }

  if (name.endsWith('.doc')) throw new Error('OLD_DOC_UNSUPPORTED');
  throw new Error('UNSUPPORTED_FILE');
}

/* ---------------- Helpers ---------------- */
const getLocalDateString = (d) => {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
};
const viDate = (s) => (s ? s.split('-').reverse().join('/') : '');

const isCustomerOverdue = (c) => {
  if (c.status !== TransactionStatus.DANG_THEO_DOI) return false;
  const today = getLocalDateString(new Date());
  const un = (c.appointments || []).filter(a => !a.isCompleted);
  const overdue = un.filter(a => a.date < today);
  const future = un.some(a => a.date >= today);
  return overdue.length > 0 && !future;
};

// Chuan hoa SDT VN: bo khoang trang, dau cham, gach; +84 -> 0
function normPhone(p) {
  let s = String(p || '').replace(/[^\d+]/g, '');
  if (s.startsWith('+84')) s = '0' + s.slice(3);
  else if (s.startsWith('84') && s.length >= 10) s = '0' + s.slice(2);
  return s;
}
// Zalo dung so quoc te khong dau +
function zaloPhone(p) {
  const s = normPhone(p);
  return s.startsWith('0') ? '84' + s.slice(1) : s.replace(/^\+/, '');
}
const telHref  = (p) => 'tel:' + normPhone(p);
const smsHref  = (p) => 'sms:' + normPhone(p);
const zaloHref = (p) => 'https://zalo.me/' + zaloPhone(p);

function Toast({ n }) {
  if (!n) return null;
  const map = {
    success: 'bg-jade', error: 'bg-crimson', warning: 'bg-amber2', info: 'bg-brand'
  };
  return (
    <div className="fixed left-1/2 -translate-x-1/2 bottom-6 z-[1500] px-5 py-3 rounded-2xl shadow-pop text-white text-[13px] font-bold max-w-[92vw] text-center fade-in"
         style={{ paddingBottom: 'max(12px, env(safe-area-inset-bottom))' }}>
      <span className={`absolute inset-0 rounded-2xl ${map[n.type] || 'bg-ink'}`}></span>
      <span className="relative">{n.msg}</span>
    </div>
  );
}

function Modal({ open, onClose, children, max = 'max-w-md', z = 900, shake }) {
  if (!open) return null;
  return (
    <div className="modal-wrap fade-in" style={{ zIndex: z }} onClick={onClose ? (e) => { if (e.target === e.currentTarget) onClose(); } : undefined}>
      <div className={`sheet pop-in ${max} ${shake ? 'shake' : ''} max-h-[92vh] overflow-y-auto`}>{children}</div>
    </div>
  );
}

/** Nut so dien thoai: bam ra menu Goi / SMS / Zalo */
function PhoneAction({ phone, compact }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const away = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', away);
    document.addEventListener('touchstart', away);
    return () => { document.removeEventListener('mousedown', away); document.removeEventListener('touchstart', away); };
  }, [open]);
  if (!phone) return null;
  const stop = (e) => { e.stopPropagation(); };
  const items = [
    { k: 'call', label: 'Gọi điện',   href: telHref(phone),  icon: <I.Phone width="15" height="15" />,   cls: 'text-jade' },
    { k: 'sms',  label: 'Nhắn SMS',   href: smsHref(phone),  icon: <I.Message width="15" height="15" />, cls: 'text-brand' },
    { k: 'zalo', label: 'Nhắn Zalo',  href: zaloHref(phone), icon: <I.Zalo width="15" height="15" />,    cls: 'text-[#0068ff]', ext: true }
  ];
  return (
    <span className="relative inline-block" ref={wrapRef} onClick={stop}>
      <button onClick={(e) => { stop(e); setOpen(o => !o); }}
        className={`btn font-mono font-bold text-brand hover:bg-blue-50 ${compact ? 'text-[13px] px-2 py-1' : 'text-[15px] px-2.5 py-1.5'} -ml-2`}
        title="Bấm để gọi, nhắn SMS hoặc Zalo">
        <I.Phone width={compact ? 13 : 14} height={compact ? 13 : 14} /> {phone}
      </button>
      {open && (
        <span className="absolute left-0 top-full mt-1 z-50 bg-white rounded-2xl shadow-pop border border-line p-1.5 min-w-[168px] flex flex-col pop-in">
          {items.map(it => (
            <a key={it.k} href={it.href}
               {...(it.ext ? { target: '_blank', rel: 'noopener' } : {})}
               onClick={(e) => { stop(e); setOpen(false); }}
               className={`btn justify-start px-3 py-2.5 text-[13px] hover:bg-paper ${it.cls}`}>
              {it.icon} <span className="text-ink font-semibold">{it.label}</span>
            </a>
          ))}
        </span>
      )}
    </span>
  );
}

function burstConfetti() {
  const colors = ['#e08a1e', '#0f9d76', '#1d6fd0', '#d8324b', '#6d4de0', '#f5c451'];
  for (let i = 0; i < 44; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[i % colors.length];
    el.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
    el.style.animationDelay = (Math.random() * .5) + 's';
    el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4600);
  }
}


/* ========================= KHO KIEN THUC XU LY TINH HUONG ========================= */
function KnowledgeBaseSettings({ notify }) {
  const [items, setItems] = useState([]);
  const [editingId, setEditingId] = useState('');
  const [title, setTitle] = useState('');
  const [content, setContent] = useState('');
  const [saving, setSaving] = useState(false);
  const [fileBusy, setFileBusy] = useState(false);
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);
  const speechBaseRef = useRef('');
  const fileRef = useRef(null);

  useEffect(() => {
    const off = dbOnValue('settings/aiHandlingKnowledge', d => setItems(normalizeKnowledgeEntries(d)));
    return () => { off && off(); stopSpeech(); };
  }, []);

  const newItem = () => {
    stopSpeech();
    setEditingId(''); setTitle(''); setContent('');
  };

  const editItem = (it) => {
    stopSpeech();
    setEditingId(it.id || ''); setTitle(it.title || ''); setContent(it.content || '');
  };

  const saveItem = async () => {
    const t = title.trim(), c = content.trim();
    if (!t) { notify('Vui lòng nhập tiêu đề tình huống', 'warning'); return; }
    if (!c) { notify('Vui lòng nhập nội dung cách xử lý', 'warning'); return; }
    const id = editingId || uuid();
    const old = items.find(x => x.id === id);
    const payload = {
      id, title: t, content: c,
      createdAt: old?.createdAt || Date.now(),
      updatedAt: Date.now()
    };
    setSaving(true);
    const ok = await dbSet(`settings/aiHandlingKnowledge/${id}`, payload);
    setSaving(false);
    if (!ok) { notify('Không lưu được kho kiến thức lên Firebase', 'error'); return; }
    setEditingId(id);
    notify('Đã lưu tình huống vào Kho kiến thức AI', 'success');
  };

  const removeItem = async (it) => {
    if (!window.confirm(`Xóa tình huống “${it.title}”?`)) return;
    const ok = await dbRemove(`settings/aiHandlingKnowledge/${it.id}`);
    if (!ok) { notify('Không xóa được nội dung', 'error'); return; }
    if (editingId === it.id) newItem();
    notify('Đã xóa tình huống', 'success');
  };

  function stopSpeech() {
    const r = recRef.current; recRef.current = null;
    if (r) { r.onend = null; r.onresult = null; try { r.stop(); } catch (e) {} }
    setListening(false);
  }

  const toggleSpeech = () => {
    if (recRef.current) { stopSpeech(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { notify('Trình duyệt này chưa hỗ trợ chuyển giọng nói thành văn bản', 'error'); return; }
    const rec = new SR();
    rec.lang = 'vi-VN'; rec.interimResults = true; rec.continuous = true;
    speechBaseRef.current = content || '';
    rec.onresult = (e) => {
      let interim = '', finalText = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (finalText) {
        const f = finalText.charAt(0).toUpperCase() + finalText.slice(1);
        speechBaseRef.current += (speechBaseRef.current ? '\n' : '') + f;
      }
      setContent(speechBaseRef.current + (interim ? (speechBaseRef.current ? '\n' : '') + interim : ''));
    };
    rec.onerror = () => { stopSpeech(); };
    rec.onend = () => { if (recRef.current === rec) { try { rec.start(); } catch (e) { stopSpeech(); } } };
    recRef.current = rec; setListening(true);
    try { rec.start(); } catch (e) { stopSpeech(); }
  };

  const uploadFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setFileBusy(true);
    try {
      let txt = await extractKnowledgeFileText(file);
      if (!txt) throw new Error('EMPTY_FILE_TEXT');
      const max = 150000;
      if (txt.length > max) {
        txt = txt.slice(0, max) + '\n\n[Phần còn lại của tài liệu đã được lược bớt do dung lượng quá lớn.]';
        notify('Tài liệu rất dài — đã lấy 150.000 ký tự đầu để tránh kho dữ liệu quá nặng', 'warning', 5000);
      } else notify(`Đã đọc nội dung từ ${file.name}`, 'success');
      if (!title.trim()) setTitle(file.name.replace(/\.(pdf|docx|txt)$/i, ''));
      setContent(prev => (prev.trim() ? prev.trim() + '\n\n' : '') + txt);
    } catch (err) {
      const code = String(err && err.message || err);
      const msg = code.includes('OLD_DOC') ? 'File .doc đời cũ chưa đọc trực tiếp được. Hãy lưu lại thành .docx rồi tải lên.'
        : code.includes('PDF_LIB') ? 'Không tải được bộ đọc PDF. Kiểm tra kết nối Internet rồi thử lại.'
        : code.includes('DOCX_LIB') ? 'Không tải được bộ đọc Word. Kiểm tra kết nối Internet rồi thử lại.'
        : code.includes('EMPTY_FILE_TEXT') ? 'Không trích xuất được chữ từ tài liệu này. PDF có thể là bản scan hình ảnh.'
        : 'Chỉ hỗ trợ Word .docx, PDF hoặc TXT.';
      notify(msg, 'error', 5500);
    } finally { setFileBusy(false); }
  };

  return (
    <section className="bg-white border border-line rounded-2xl p-5 sm:p-7">
      <div className="flex flex-wrap items-start justify-between gap-3 mb-2">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber2 flex items-center justify-center"><I.Sparkles width="18" height="18" /></div>
          <div>
            <h3 className="font-display text-[17px] font-extrabold text-ink">Kho kiến thức xử lý tình huống AI</h3>
            <p className="text-[11px] text-slate-400 font-semibold">Kinh nghiệm nội bộ để AI tư vấn sát cách IDECO xử lý khách hàng</p>
          </div>
        </div>
        <button onClick={newItem} className="btn px-3.5 py-2.5 bg-ink text-white text-[11.5px]">
          <I.Plus width="14" height="14" /> Thêm mới
        </button>
      </div>

      <p className="text-[12.5px] text-slate-500 leading-relaxed mb-5">
        Mỗi mục gồm một tình huống và cách xử lý chuẩn. AI sẽ tham chiếu kho này khi phân tích hồ sơ khách hàng mới nhất. Có thể nhập bằng bàn phím, giọng nói hoặc lấy chữ từ Word/PDF.
      </p>

      <div className="space-y-4">
        <Field label="Tiêu đề tình huống">
          <input value={title} onChange={e => setTitle(e.target.value)} className="fld font-bold" placeholder="Ví dụ: Khách chê giá cao và yêu cầu tăng chiết khấu" />
        </Field>
        <Field label="Nội dung / cách xử lý">
          <textarea value={content} onChange={e => setContent(e.target.value)} className="fld leading-relaxed text-[13px]"
            placeholder="Mô tả tình huống, nguyên tắc xử lý, câu hỏi cần khai thác, chính sách được phép đề xuất, bước tiếp theo..."
            style={{ resize:'vertical', minHeight:'170px', maxHeight:'520px' }} />
        </Field>

        <div className="grid sm:grid-cols-2 gap-2">
          <button onClick={toggleSpeech}
            className={`btn py-3 text-[12px] border ${listening ? 'bg-crimson text-white border-crimson' : 'bg-blue-50 text-brand border-blue-100'}`}>
            {listening ? <><span className="w-2.5 h-2.5 bg-white rounded-sm pulse-ring" /> Đang nghe — bấm để dừng</>
              : <><I.Mic width="15" height="15" /> Nói thành văn bản</>}
          </button>
          <button onClick={() => fileRef.current && fileRef.current.click()} disabled={fileBusy}
            className="btn py-3 bg-paper text-slate-600 border border-line text-[12px] disabled:opacity-60">
            {fileBusy ? <I.Loader width="15" height="15" className="animate-spin" /> : <I.Upload width="15" height="15" />}

          </button>

            onChange={uploadFile} className="hidden" />

        <button onClick={saveItem} disabled={saving}
          className="btn w-full py-3.5 bg-amber2 text-white text-[13px] uppercase tracking-wider shadow-lift disabled:opacity-60">
          {saving ? <I.Loader width="16" height="16" className="animate-spin" /> : <I.Save width="16" height="16" />}
          {saving ? 'Đang lưu…' : (editingId ? 'Lưu cập nhật' : 'Lưu vào kho kiến thức')}

          {editingId && <span className="text-[10.5px] font-bold text-amber2">Đang sửa 1 mục</span>}
        </div>
        {items.length === 0 ? (
          <div className="rounded-2xl bg-paper p-4 text-[12.5px] text-slate-400 text-center">Chưa có tình huống nào trong kho.</div>
        ) : (
          <div className="space-y-2 max-h-[360px] overflow-y-auto pr-1">
            {items.map(it => (
              <div key={it.id} className={`spine rounded-2xl border p-4 pl-5 ${editingId === it.id ? 'bg-amber-50/60 border-amber-200' : 'bg-paper border-transparent'}`}
                   style={{ '--spine': editingId === it.id ? '#e08a1e' : '#cbd5e1' }}>
                <p className="font-bold text-ink text-[13.5px]">{it.title}</p>
                <p className="text-[11.5px] text-slate-500 mt-1.5 line-clamp-2 leading-relaxed">{it.content}</p>
                <div className="flex gap-2 mt-3">
                  <button onClick={() => editItem(it)} className="btn px-3 py-2 bg-white border border-line text-brand text-[11px]"><I.Edit width="13" height="13" /> Sửa</button>
                  <button onClick={() => removeItem(it)} className="btn px-3 py-2 bg-white border border-rose-100 text-crimson text-[11px]"><I.Trash width="13" height="13" /> Xóa</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}


/* ====================== HUYỀN LIVE — GỬI PHÂN TÍCH CHO NHÂN VIÊN ======================
   - Dùng Firebase hiện có, không thêm SDK/CSS toàn cục.
   - Mỗi nhân viên có đường dẫn riêng; thông báo tồn tại đến khi người nhận bấm "Đã hiểu".
*/
function huyenLiveCanonicalStaffName(name) {
  return String(name || '').replace(/\s+/g, ' ').trim();
}
function huyenLiveFoldStaffName(name) {
  return huyenLiveCanonicalStaffName(name).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
}
function huyenLiveStaffKey(name) {
  const base = huyenLiveFoldStaffName(name);
  let h = 2166136261;
  for (let i = 0; i < base.length; i++) { h ^= base.charCodeAt(i); h = Math.imul(h, 16777619); }
  const slug = base.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 28) || 'nhan-vien';
  return `${slug}_${(h >>> 0).toString(36)}`;
}
function huyenLiveShortHash(value) {
  const s = String(value || '');
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function huyenLiveCaseKey(staffName, customerId, customerName) {
  const staff = huyenLiveFoldStaffName(staffName);
  const cid = String(customerId || '').trim();
  const cname = huyenLiveFoldStaffName(customerName || '');
  const raw = `${staff}|${cid ? `id:${cid}` : `name:${cname}`}`;
  return `case_${huyenLiveShortHash(raw)}_${huyenLiveShortHash(staff).slice(0,5)}_${huyenLiveShortHash(cid || cname).slice(0,5)}`;
}
const HUYEN_LIVE_CASE_ACK_STORAGE = 'ideco_huyen_live_case_ack_v5';
function huyenLiveCaseAckMap() {
  try {
    const x = JSON.parse(localStorage.getItem(HUYEN_LIVE_CASE_ACK_STORAGE) || '{}');
    return x && typeof x === 'object' && !Array.isArray(x) ? x : {};
  } catch (e) { return {}; }
}
function huyenLiveCaseAckAt(caseKey) {
  if (!caseKey) return 0;
  return Number(huyenLiveCaseAckMap()[caseKey] || 0);
}
function huyenLiveMarkCaseAck(caseKey, at = Date.now()) {
  if (!caseKey) return;
  try {
    const x = huyenLiveCaseAckMap();
    x[caseKey] = Math.max(Number(x[caseKey] || 0), Number(at || Date.now()));
    const keys = Object.keys(x).sort((a,b) => Number(x[b] || 0) - Number(x[a] || 0)).slice(0,120);
    const keep = {}; keys.forEach(k => { keep[k] = x[k]; });
    localStorage.setItem(HUYEN_LIVE_CASE_ACK_STORAGE, JSON.stringify(keep));
  } catch (e) {}
}

function formatHuyenAdvisorForLive(customer, r, mode = 'fast') {
  if (!r) return '';
  const lines = [];
  const add = (title, value) => { const v = String(value || '').trim(); if (v) lines.push(`${title}\n${v}`); };
  add('KHÁCH HÀNG', customer?.name || '');
  add('CHẾ ĐỘ PHÂN TÍCH', mode === 'deep' ? 'Phân tích chuyên sâu' : 'Phân tích nhanh');
  add('TÓM TẮT TÌNH HUỐNG', r.situationSummary);
  add('GIAI ĐOẠN SALES', r.stage);
  add('MỨC ƯU TIÊN', r.priority);
  add('RÀO CẢN CHÍNH', r.mainBarrier);
  add('CHẨN ĐOÁN CƠ HỘI SALES', r.salesDiagnosis);
  add('TÂM THẾ KHÁCH HÀNG', r.customerMindset);
  if (r.dealHealth) add('KHẢ NĂNG TIẾN TỚI HỢP TÁC', `${r.dealHealth.score ?? ''}${r.dealHealth.score !== undefined ? '%' : ''} ${r.dealHealth.label || ''}\n${r.dealHealth.basis || ''}`.trim());
  if (Array.isArray(r.scenarioHypotheses) && r.scenarioHypotheses.length) {
    add('GIẢ THUYẾT TÌNH HUỐNG SALES', r.scenarioHypotheses.map((x,i) => `${i+1}. ${x.scenario || ''}${x.confidence ? ` [Tin cậy ${x.confidence}]` : ''}\n- Căn cứ: ${x.evidenceFor || ''}\n- Điểm chưa chắc: ${x.evidenceAgainst || ''}\n- Cần kiểm chứng: ${x.checkNext || ''}\n- Nếu đúng nên xử lý: ${x.bestResponse || ''}`).join('\n\n'));
  }
  if (Array.isArray(r.questionsToAsk) && r.questionsToAsk.length) add('CÂU HỎI NÊN HỎI', r.questionsToAsk.map((x,i)=>`${i+1}. ${x}`).join('\n'));
  if (r.nextConversationPlan) add('KỊCH BẢN LẦN TRAO ĐỔI TIẾP', [`Mở đầu: ${r.nextConversationPlan.opening || ''}`,`Khai thác: ${r.nextConversationPlan.discovery || ''}`,`Nối giá trị: ${r.nextConversationPlan.valueBridge || ''}`,`Xin cam kết: ${r.nextConversationPlan.close || ''}`].join('\n'));
  if (Array.isArray(r.recommendedActions) && r.recommendedActions.length) add('HƯỚNG XỬ LÝ ƯU TIÊN', r.recommendedActions.map((x,i)=>`${x.step || i+1}. ${x.action || ''}\n- Lý do: ${x.reason || ''}\n- Mục tiêu: ${x.goal || ''}${x.suggestedScript ? `\n- Gợi ý trao đổi: “${x.suggestedScript}”` : ''}`).join('\n\n'));
  if (Array.isArray(r.objectionHandling) && r.objectionHandling.length) add('XỬ LÝ TỪ CHỐI / PHẢN ĐỐI', r.objectionHandling.map((x,i)=>`${i+1}. ${x.objection || ''}${x.classification ? ` — ${x.classification}` : ''}\n- Cần hỏi rõ: ${x.clarifyingQuestion || ''}\n- Hướng xử lý: ${x.responseStrategy || ''}`).join('\n\n'));
  if (r.closingPlan) add('KẾ HOẠCH CHỐT HỢP TÁC', [`Mục tiêu: ${r.closingPlan.objective || ''}`,`Cam kết nhỏ nhất: ${r.closingPlan.minimumCommitment || ''}`,`Giá trị nên nhấn: ${r.closingPlan.valueAngle || ''}`,`Nếu chưa chốt: ${r.closingPlan.fallback || ''}`].join('\n'));
  if (Array.isArray(r.negotiationPlan) && r.negotiationPlan.length) add('YÊU CẦU / ĐIỀU KIỆN KHÁCH HÀNG', r.negotiationPlan.map((x,i)=>`${i+1}. ${x.request || ''}\n- Cách phản hồi: ${x.recommendedResponse || ''}\n- Thẩm quyền: ${x.authority || ''}${x.approvalNeeded ? `\n- Cần xin duyệt: ${x.approvalNeeded}` : ''}`).join('\n\n'));
  if (Array.isArray(r.opportunities) && r.opportunities.length) add('CƠ HỘI', r.opportunities.map(x=>`• ${x}`).join('\n'));
  if (Array.isArray(r.risks) && r.risks.length) add('RỦI RO CẦN CHÚ Ý', r.risks.map(x=>`• ${x}`).join('\n'));
  if (Array.isArray(r.whatNotToDo) && r.whatNotToDo.length) add('KHÔNG NÊN LÀM', r.whatNotToDo.map(x=>`• ${x}`).join('\n'));
  if (Array.isArray(r.missingInfo) && r.missingInfo.length) add('THÔNG TIN CẦN KHAI THÁC THÊM', r.missingInfo.map(x=>`• ${x}`).join('\n'));
  add('BGĐ NÊN HỖ TRỢ', r.managementSupport);
  add('THEO DÕI TIẾP', r.nextFollowUp);
  add('ĐÁNH GIÁ THỜI GIAN GIAO DỊCH', r.timelineAssessment);
  add('ĐỀ NGHỊ BƯỚC TIẾP THEO', r.relationshipDecision);
  if (r.talkToTriet?.needed || r.talkToTriet?.reason || r.talkToTriet?.ask) add('NỘI DUNG CẦN TRAO ĐỔI CHÚ TRIẾT / BGĐ', `${r.talkToTriet?.reason || ''}${r.talkToTriet?.ask ? `\n${r.talkToTriet.ask}` : ''}`);
  add('ĐỀ XUẤT TỐT NHẤT', r.finalAdvice);
  return lines.join('\n\n').slice(0, 60000);
}

async function publishHuyenLiveAnalysis(customer, result, mode = 'fast') {
  if (!IDECO_CAN_PUBLISH_HUYEN_LIVE) throw new Error('LIVE chỉ được phát từ ứng dụng QUẢN TRỊ HUYỀN LIVE.');
  const staffName = huyenLiveCanonicalStaffName(customer?.salesRep || '');
  if (!staffName) throw new Error('Hồ sơ chưa có Nhân viên phụ trách nên chưa thể gửi Live.');
  const id = `live_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  const staffKey = huyenLiveStaffKey(staffName);
  const caseKey = huyenLiveCaseKey(staffName, customer?.id, customer?.name);
  const path = `huyenLive/${staffKey}/${id}`;
  const payload = {
    id, staffName, staffKey, caseKey,
    customerId: String(customer?.id || ''), customerName: String(customer?.name || ''),
    mode: mode === 'deep' ? 'deep' : 'fast',
    title: `Bạn ${staffName}, Huyền được phân công BGĐ gởi bạn phần nội dung gợi ý xử lý về khách hàng mới mà bạn đang giao dịch, bạn xem lại và tìm cách chốt:`,
    content: formatHuyenAdvisorForLive(customer, result, mode),
    createdAt: Date.now(), acknowledgedAt: null, acknowledgedBy: '', source: 'HUYEN_MANAGER_LIVE_V1'
  };
  const ok = await dbSet(path, payload);
  if (!ok) throw new Error('Chưa gửi được Live lên Firebase. Kiểm tra kết nối rồi thử lại.');

  /* Xác nhận bản ghi đã thực sự có trên Firebase. Tránh trường hợp UI báo "đã gửi" nhưng mạng vừa rớt. */
  let verified = null;
  for (let n = 0; n < 2 && !verified; n++) {
    if (n) await new Promise(r => setTimeout(r, 450));
    verified = await dbGet(path);
  }
  if (!verified || String(verified.id || '') !== id) {
    throw new Error('Live chưa được Firebase xác nhận. Vui lòng kiểm tra mạng rồi bấm Live lại.');
  }

  /* V5 BROADCAST + CASE KEY: ghi thêm 1 bản CURRENT chung để mọi website nhúng nhận được
     mà KHÔNG cần đoán tên nhân viên đang mở trang. Hộp thư riêng phía trên vẫn giữ nguyên. */
  const broadcastPayload = { ...payload, broadcastId: id, publishedAt: Date.now(), source: 'HUYEN_MANAGER_LIVE_V1_BROADCAST' };
  const broadcastPath = 'huyenLiveBroadcast/current';
  const broadcastOk = await dbSet(broadcastPath, broadcastPayload);
  if (!broadcastOk) throw new Error('Đã lưu Live cho nhân viên nhưng chưa phát được kênh Live chung. Vui lòng bấm Live lại.');
  let broadcastVerified = await dbGet(broadcastPath);
  if (!broadcastVerified || String(broadcastVerified.id || broadcastVerified.broadcastId || '') !== id) {
    await new Promise(r => setTimeout(r, 450));
    broadcastVerified = await dbGet(broadcastPath);
  }
  if (!broadcastVerified || String(broadcastVerified.id || broadcastVerified.broadcastId || '') !== id) {
    throw new Error('Kênh Live chung chưa được Firebase xác nhận. Vui lòng kiểm tra mạng rồi bấm Live lại.');
  }

  /* Widget cùng trang nhận ngay; website khác nhận qua Firebase/poll tối đa khoảng 10 giây. */
  try { window.dispatchEvent(new CustomEvent('ideco:huyen-live-published', { detail: broadcastPayload })); } catch (e) {}
  return broadcastPayload;
}
